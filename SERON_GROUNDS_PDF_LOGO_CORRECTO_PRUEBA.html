 <p class=small>Apunta aquí recordatorios, ideas, materiales pendientes o cualquier cosa que quieras guardar.</p>
 <div class=grid>
  <label>Título<input id=noteTitle placeholder="Ej.: Comprar abono"></label>
  <label>Fecha<input id=noteDate type=date value="${new Date().toISOString().slice(0,10)}"></label>
  <label class=full>Nota<textarea id=noteText placeholder="Escribe aquí..."></textarea></label>
  <label><input id=noteImportant type=checkbox style="width:auto;margin-right:8px">⭐ Marcar como importante</label>
 </div>
 <div class=actions><button class="btn primary" onclick=saveNote()>Guardar nota</button></div></div>
 <div class=card><input id=noteSearch placeholder="🔎 Buscar en mis notas..." oninput=filterNotes()>
 <div id=notesList style="margin-top:10px">${x.length?x.map(noteCard).join(''):'Todavía no hay notas.'}</div></div>`;
}
function noteCard(n){
 let id=JSON.stringify(String(n.id));
 return `<div class=item data-note="${esc(((n.title||'')+' '+(n.text||'')+' '+(n.date||'')).toLowerCase())}">
 <b>${n.important?'⭐ ':''}${esc(n.title||'Sin título')}</b>
 <div class=small>${esc(n.date||'')}<br>${esc(n.text||'').replace(/\n/g,'<br>')}</div>
 <div class=actions><button class=btn onclick='editNote(${id})'>✏️ Editar</button><button class=btn onclick='toggleNoteImportant(${id})'>${n.important?'☆ Quitar importante':'⭐ Importante'}</button><button class=btn onclick='deleteNote(${id})'>Eliminar</button></div></div>`;
}
function saveNote(){
 let title=(noteTitle.value||'').trim(),text=(noteText.value||'').trim();
 if(!title&&!text){alert('Escribe un título o una nota.');return}
 let x=notesData(),now=new Date().toISOString();
 x.push({id:'N'+Date.now(),title,date:noteDate.value||now.slice(0,10),text,important:!!noteImportant.checked,created:now,updated:now});
 S.set('notes',x);notesPage();
}
function editNote(id){
 let x=notesData(),n=x.find(v=>String(v.id)===String(id));if(!n)return;
 app.innerHTML=`<div class=card><h2>✏️ Editar nota</h2><div class=grid>
 <label>Título<input id=editNoteTitle value="${esc(n.title||'')}"></label>
 <label>Fecha<input id=editNoteDate type=date value="${esc(n.date||'')}"></label>
 <label class=full>Nota<textarea id=editNoteText>${esc(n.text||'')}</textarea></label>
 <label><input id=editNoteImportant type=checkbox style="width:auto;margin-right:8px" ${n.important?'checked':''}>⭐ Importante</label>
 </div><div class=actions><button class="btn primary" onclick='updateNote(${JSON.stringify(String(id))})'>Guardar cambios</button><button class=btn onclick=notesPage()>Cancelar</button></div></div>`;
}
function updateNote(id){
 let x=notesData(),i=x.findIndex(v=>String(v.id)===String(id));if(i<0)return;
 x[i]={...x[i],title:(editNoteTitle.value||'').trim(),date:editNoteDate.value,text:(editNoteText.value||'').trim(),important:!!editNoteImportant.checked,updated:new Date().toISOString()};
 S.set('notes',x);notesPage();
}
function toggleNoteImportant(id){
 let x=notesData(),i=x.findIndex(v=>String(v.id)===String(id));if(i<0)return;
 x[i].important=!x[i].important;x[i].updated=new Date().toISOString();S.set('notes',x);notesPage();
}
function deleteNote(id){
 if(!confirm('¿Eliminar esta nota?'))return;
 S.set('notes',notesData().filter(v=>String(v.id)!==String(id)));notesPage();
}
function filterNotes(){
 let q=(noteSearch.value||'').toLowerCase().trim();
 document.querySelectorAll('#notesList [data-note]').forEach(e=>e.style.display=!q||e.dataset.note.includes(q)?'':'none');
}

function homeAlerts(){
 let today=new Date().toISOString().slice(0,10),limit=plusDays(today,7),allInv=S.get('invoices'),
 overdue=allInv.map((d,i)=>({d,i})).filter(o=>invoiceState(o.d)==='Vencida'),
 recurring=S.get('recurringJobs').filter(r=>r.next&&r.next>=today&&r.next<=limit).sort((a,b)=>a.next.localeCompare(b.next)),
 agenda=S.get('agenda').filter(e=>e.date>=today&&e.date<=limit).sort((a,b)=>(a.date+(a.time||'')).localeCompare(b.date+(b.time||''))).slice(0,8),
 overdueTotal=overdue.reduce((a,o)=>a+pendingAmount(o.d),0);
 return `<div class=card><h2>🔔 Avisos</h2>${overdue.length?`<p><b>${overdue.length} factura(s) vencida(s) · ${money(overdueTotal)} pendientes</b></p>${overdue.slice(0,5).map(o=>`<div class=item><b>${o.d.no} · ${esc(o.d.client?.name||'')}</b><div class=small>Venció ${o.d.due} · Pendiente ${money(pendingAmount(o.d))}</div><button class=btn onclick="shareWhatsApp('F',${o.i})">💬 Recordar</button></div>`).join('')}`:'<p class=small>No hay facturas vencidas.</p>'}</div>
 <div class=card><h2>📅 Próximos 7 días</h2>${agenda.length?agenda.map(e=>`<div class=item><b>${e.date} ${esc(e.time||'')} · ${esc(e.client||'')}</b><div class=small>${esc(e.type||'')} · ${esc(e.notes||'')}</div></div>`).join(''):'<p class=small>No hay citas próximas en agenda.</p>'}${recurring.length?`<h3>🔁 Mantenimientos recurrentes</h3>${recurring.map(r=>`<div class=item><b>${r.next} · ${esc(r.client?.name||'')}</b><div class=small>${esc(r.desc||'')} · ${esc(r.freq||'')}</div></div>`).join('')}`:''}</div>${palmHomeAlerts()}`
}

function palmHomeAlerts(){let x=S.get('palmTreatments',[]),today=new Date().toISOString().slice(0,10),limit=plusDays(today,7),due=x.filter(p=>p.nextDate&&p.nextDate<=limit).sort((a,b)=>a.nextDate.localeCompare(b.nextDate));if(!due.length)return '';return `<div class=card><h2>🌴 Avisos de palmeras</h2>${due.slice(0,8).map(p=>{let st=palmStatus(p.nextDate);return `<div class=item><b>${st.icon} ${esc(p.client||'Sin cliente')}</b><div class=small>${esc(p.address||'')}<br>Próximo tratamiento: <b>${palmDate(p.nextDate)}</b> · ${st.text}</div></div>`}).join('')}<div class=actions><button class=btn onclick="go('🌴 Palmeras')">Ver tratamientos</button></div></div>`}
function palmDate(d){if(!d)return '—';try{return new Date(d+'T12:00:00').toLocaleDateString('es-ES')}catch{return d}}
function palmStatus(d){if(!d)return {text:'Sin fecha',icon:'⚪'};let today=new Date().toISOString().slice(0,10),limit=plusDays(today,7);if(d<today)return {text:'ATRASADO',icon:'🔴'};if(d===today)return {text:'HOY',icon:'🔴'};if(d<=limit)return {text:'PRÓXIMO',icon:'🟡'};return {text:'AL DÍA',icon:'🟢'}}
function palmDbToLocal(p){return {id:String(p.id),client:p.client||'',phone:p.phone||'',address:p.address||'',treatedDate:p.treatment_date||'',nextDate:p.next_treatment_date||'',notes:p.notes||'',updated:p.updated_at||p.created_at||''}}
async function loadPalmTreatments(){try{let rows=await sb('palm_treatments','GET','select=*&order=next_treatment_date.asc');let x=(rows||[]).map(palmDbToLocal);S.set('palmTreatments',x);return x}catch(e){throw new Error('No se pudieron cargar los tratamientos: '+e.message)}}
async function palmTreatments(){app.innerHTML=`<div class=card><h2>🌴 Tratamientos de palmeras</h2><p class=small>Los tratamientos se guardan en Supabase y estarán disponibles desde tus dispositivos.</p><div class=grid><label>Cliente<input id=ptclient placeholder="Nombre del cliente"></label><label>Teléfono<input id=ptphone inputmode=tel></label><label class=full>Dirección<input id=ptaddress></label><label>Fecha del tratamiento<input id=ptdate type=date></label><label>Próximo tratamiento<input id=ptnext type=date></label><label class=full>Observaciones<textarea id=ptnotes placeholder="Producto, número de palmeras, estado, dosis, incidencias..."></textarea></label></div><div class=actions><button class="btn primary" onclick=savePalmTreatment()>Guardar tratamiento</button><button class=btn onclick=palmTreatments()>↻ Actualizar</button></div></div><div class=card><input id=ptsearch placeholder="🔎 Buscar cliente, teléfono, dirección o notas..." oninput=filterPalmTreatments()><div id=ptlist style="margin-top:10px">Cargando tratamientos…</div></div>`;try{let x=await loadPalmTreatments();if(page!=='🌴 Palmeras')return;ptlist.innerHTML=x.length?x.map(p=>palmTreatmentCard(p)).join(''):'Todavía no hay tratamientos de palmeras.'}catch(e){ptlist.innerHTML=`<b>No se pudieron cargar los tratamientos.</b><div class=small>${esc(e.message)}</div>`}}
function palmTreatmentCard(p){let st=palmStatus(p.nextDate),id=JSON.stringify(String(p.id));return `<div class=item data-palm="${esc([p.client,p.phone,p.address,p.notes,p.nextDate].join(' ').toLowerCase())}"><b>${st.icon} ${esc(p.client||'Sin cliente')}</b> · <b>${st.text}</b><div class=small>📞 ${esc(p.phone||'—')}<br>📍 ${esc(p.address||'—')}<br>Tratado: ${palmDate(p.treatedDate)} · Próximo: <b>${palmDate(p.nextDate)}</b>${p.notes?'<br>📝 '+esc(p.notes).replace(/\n/g,'<br>'):''}</div><div class=actions><button class=btn onclick='editPalmTreatment(${id})'>✏️ Editar</button><button class="btn primary" onclick='markPalmTreated(${id})'>✅ Marcar tratado</button><button class=btn onclick='deletePalmTreatment(${id})'>Eliminar</button></div></div>`}
function filterPalmTreatments(){let q=(ptsearch.value||'').toLowerCase().trim();document.querySelectorAll('#ptlist [data-palm]').forEach(e=>e.style.display=!q||e.dataset.palm.includes(q)?'':'none')}
async function savePalmTreatment(){if(!ptclient.value.trim()){alert('Escribe el nombre del cliente.');return}if(!ptnext.value){alert('Indica la fecha del próximo tratamiento.');return}try{await sb('palm_treatments','POST','',{client:ptclient.value.trim(),phone:ptphone.value.trim(),address:ptaddress.value.trim(),treatment_date:ptdate.value||null,next_treatment_date:ptnext.value,notes:ptnotes.value.trim(),updated_at:new Date().toISOString()});alert('Tratamiento guardado en Supabase.');await palmTreatments()}catch(e){alert('No se pudo guardar: '+e.message)}}
async function editPalmTreatment(id){try{let rows=await sb('palm_treatments','GET','id=eq.'+encodeURIComponent(id)+'&select=*');let p=rows&&rows[0];if(!p)return alert('No se encontró el tratamiento.');app.innerHTML=`<div class=card><h2>✏️ Editar tratamiento</h2><div class=grid><label>Cliente<input id=peclient value="${esc(p.client||'')}"></label><label>Teléfono<input id=pephone value="${esc(p.phone||'')}"></label><label class=full>Dirección<input id=peaddress value="${esc(p.address||'')}"></label><label>Fecha del tratamiento<input id=pedate type=date value="${esc(p.treatment_date||'')}"></label><label>Próximo tratamiento<input id=penext type=date value="${esc(p.next_treatment_date||'')}"></label><label class=full>Observaciones<textarea id=penotes>${esc(p.notes||'')}</textarea></label></div><div class=actions><button class="btn primary" onclick='updatePalmTreatment(${JSON.stringify(String(id))})'>Guardar cambios</button><button class=btn onclick=palmTreatments()>Cancelar</button></div></div>`}catch(e){alert('No se pudo abrir: '+e.message)}}
async function updatePalmTreatment(id){if(!peclient.value.trim()||!penext.value){alert('Cliente y próximo tratamiento son obligatorios.');return}try{await sb('palm_treatments','PATCH','id=eq.'+encodeURIComponent(id),{client:peclient.value.trim(),phone:pephone.value.trim(),address:peaddress.value.trim(),treatment_date:pedate.value||null,next_treatment_date:penext.value,notes:penotes.value.trim(),updated_at:new Date().toISOString()});await palmTreatments()}catch(e){alert('No se pudo actualizar: '+e.message)}}
async function markPalmTreated(id){let today=new Date().toISOString().slice(0,10),local=S.get('palmTreatments',[]).find(p=>String(p.id)===String(id)),next=prompt('Fecha del próximo tratamiento (AAAA-MM-DD):',local?.nextDate||plusDays(today,30));if(!next)return;try{await sb('palm_treatments','PATCH','id=eq.'+encodeURIComponent(id),{treatment_date:today,next_treatment_date:next,updated_at:new Date().toISOString()});await palmTreatments()}catch(e){alert('No se pudo marcar como tratado: '+e.message)}}
async function deletePalmTreatment(id){if(!confirm('¿Eliminar este tratamiento de palmera?'))return;try{await sb('palm_treatments','DELETE','id=eq.'+encodeURIComponent(id));await palmTreatments()}catch(e){alert('No se pudo eliminar: '+e.message)}}

function clients(){let x=S.get('clients');app.innerHTML=`<div class=card><h2>Clientes</h2><div class=grid><label>Nombre<input id=cn></label><label>NIF/CIF<input id=ci></label><label>Teléfono<input id=cp></label><label>Email<input id=ce></label><label>Dirección fiscal<input id=ca></label><label>Dirección del trabajo<input id=cwork></label><label>C.P. / Población<input id=ccity></label><label class=full>Notas<textarea id=cnotes></textarea></label></div><div class=actions><button class="btn primary" onclick="addClient()">Guardar cliente</button></div></div><div class=card><input id=clientSearch placeholder="🔎 Buscar cliente..." oninput="filterClientCards()" style="margin-bottom:12px"><div id=clientCards>${x.length?x.map((c,i)=>`<div class=item><b>${esc(c.name)}</b><div class=small>${esc(c.nif)} · ${esc(c.phone)}<br>${esc(c.address)}</div><button class="btn no-print" onclick="clientHistory(${i})">📇 Historial</button><button class="btn no-print" onclick="whatsClient(${i})">💬 WhatsApp</button><button class="btn no-print" onclick="mapClient(${i})">📍 Ir</button><button class="btn no-print" onclick="del('clients',${i})">Eliminar</button></div>`).join(''):'Todavía no hay clientes.'}</div></div>`}
function sameClient(a,b){return !!(a&&b&&((a.nif&&b.nif&&a.nif===b.nif)||(a.name===b.name&&a.phone===b.phone)))}
function clientHistory(i){
 let c=S.get('clients')[i],bs=S.get('budgets').map((d,j)=>({d,j})).filter(o=>sameClient(o.d.client,c)),
 inv=S.get('invoices').map((d,j)=>({d,j})).filter(o=>sameClient(o.d.client,c)),
 hs=S.get('hourlyJobs').map((d,j)=>({d,j})).filter(o=>sameClient(o.d.client,c)),
 rs=S.get('recurringJobs').filter(r=>sameClient(r.client,c));
 app.innerHTML=`<div class=card><h2>📇 ${esc(c.name)}</h2><div class=small>${esc(c.nif||'')} · ${esc(c.phone||'')}<br>${esc(c.address||'')} ${esc(c.city||'')}</div></div>
 <div class=card><h3>Presupuestos</h3>${bs.length?bs.map(o=>`<div class=item><b>${o.d.no}</b> · ${o.d.date} · ${money(o.d.total)} <button class=btn onclick="viewDoc('P',${o.j})">Ver</button></div>`).join(''):'Ninguno'}</div>
 <div class=card><h3>Facturas</h3>${inv.length?inv.map(o=>`<div class=item><b>${o.d.no}</b> · ${o.d.date} · ${money(o.d.total)} · ${invoiceState(o.d)} <button class=btn onclick="viewDoc('F',${o.j})">Ver</button></div>`).join(''):'Ninguna'}</div>
 <div class=card><h3>Albaranes</h3>${hs.length?hs.map(o=>`<div class=item><b>${o.d.no}</b> · ${o.d.date||''} · ${money(o.d.total)} <button class=btn onclick="viewHourly(${o.j})">Ver</button></div>`).join(''):'Ninguno'}</div>
 <div class=card><h3>Trabajos recurrentes</h3>${rs.length?rs.map(r=>`<div class=item>${esc(r.desc)} · ${esc(r.freq)} · próxima ${r.next||'—'}</div>`).join(''):'Ninguno'}</div>
 <div class=actions><button class=btn onclick="go('Clientes')">Volver</button></div>`
}
function filterClientCards(){let q=(clientSearch.value||'').toLowerCase();document.querySelectorAll('#clientCards .item').forEach(e=>e.style.display=e.innerText.toLowerCase().includes(q)?'':'none')}
function mapClient(i){let c=S.get('clients')[i];if(!c.address){alert('Este cliente no tiene dirección.');return}window.open('https://maps.apple.com/?q='+encodeURIComponent(c.address),'_blank')}
function whatsClient(i){let c=S.get('clients')[i],n=String(c.phone||'').replace(/\D/g,'');if(!n){alert('Este cliente no tiene teléfono.');return}if(n.length===9)n='34'+n;let txt='Hola '+(c.name||'')+', soy Miguel de SERÓN GROUNDS.';window.open('https://wa.me/'+n+'?text='+encodeURIComponent(txt),'_blank')}
function addClient(){let x=S.get('clients');x.push({name:cn.value,nif:ci.value,phone:cp.value,email:ce.value,address:ca.value,workAddress:cwork.value,city:ccity.value,notes:cnotes.value});S.set('clients',x);clients()}function del(k,i){if(!confirm('¿Seguro que quieres eliminar este elemento? Esta acción no se puede deshacer.'))return;let x=S.get(k);x.splice(i,1);S.set(k,x);render()}
function services(){let x=S.get('services',[{name:'Mantenimiento de jardín',price:0},{name:'Poda',price:0},{name:'Desbroce',price:0},{name:'Limpieza de parcela',price:0},{name:'Instalación / reparación de riego',price:0},{name:'Plantación',price:0},{name:'Césped',price:0},{name:'Tratamientos',price:0},{name:'Mano de obra',price:0},{name:'Materiales',price:0}]);if(!localStorage.services)S.set('services',x);app.innerHTML=`<div class=card><h2>Servicios</h2><div class=grid><label>Concepto<input id=sn></label><label>Precio habitual (€)<input id=sp type=number step=.01></label></div><div class=actions><button class="btn primary" onclick="addService()">Añadir servicio</button></div></div><div class=card>${x.map((s,i)=>`<div class=item><b>${esc(s.name)}</b> <span class=small>${(+s.price).toFixed(2)} €</span><button class="btn no-print" onclick="del('services',${i})">Eliminar</button></div>`).join('')}</div>`}
function addService(){let x=S.get('services');x.push({name:sn.value,price:+sp.value||0});S.set('services',x);services()}
function listDocs(t){
 let k=t==='P'?'budgets':'invoices',x=S.get(k);
 app.innerHTML=`<div class=card><h2>${t==='P'?'Presupuestos':'Facturas'}</h2>
 <div class=actions><button class="btn primary no-print" onclick="newDoc('${t}')">＋ Nuevo</button>
 <input id=docSearch placeholder="🔎 Buscar por cliente, número o fecha..." oninput="filterDocs('${t}')" style="max-width:360px"></div></div>
 <div class=card id=docList></div>`;filterDocs(t)
}
function filterDocs(t){
 let k=t==='P'?'budgets':'invoices',x=S.get(k),q=(document.getElementById('docSearch')?.value||'').toLowerCase().trim(),box=document.getElementById('docList');
 let rows=x.map((d,i)=>({d,i})).filter(o=>!q||[o.d.no,o.d.client?.name,o.d.date,o.d.status].join(' ').toLowerCase().includes(q)).reverse();
 box.innerHTML=rows.length?rows.map(({d,i})=>`<div class=item><b>${d.no}</b> — ${esc(d.client?.name||'Sin cliente')}<div class=small>${d.date} · ${esc(d.status||'Pendiente')} · Total: ${(+d.total||0).toFixed(2)} €${t==='F'?' · '+invoiceState(d):''}</div><div class=actions no-print><button class=btn onclick="viewDoc('${t}',${i})">👁️ Vista previa</button><button class=btn onclick="editDoc('${t}',${i})">✏️ Editar</button><button class=btn onclick="duplicateDoc('${t}',${i})">📄 Duplicar</button><button class=btn onclick="shareWhatsApp('${t}',${i})">💬 WhatsApp</button><button class="btn pdf-share" onclick="sharePDF('${t}',${i})">📲 PDF WhatsApp</button>${t==='P'?`<button class=btn onclick="acceptBudget(${i})">✅ Aceptado</button><button class=btn onclick="toInvoice(${i})">🧾 Convertir en factura</button>`:`<button class="btn primary" onclick="addPayment(${i})">💶 Cobro</button>`}<button class=btn onclick="del('${k}',${i})">Eliminar</button></div></div>`).join(''):'No hay resultados.'
}

function plusDays(d,n){let x=new Date(d+'T12:00:00');x.setDate(x.getDate()+n);return x.toISOString().slice(0,10)}
function newDoc(t){let clients=S.get('clients'),cfg=CFG(),today=new Date().toISOString().slice(0,10);app.innerHTML=`<div class=card><h2>Nuevo ${t==='P'?'presupuesto':'factura'} · ${nextNo(t)}</h2><div class=grid><label>Fecha de emisión<input id=date type=date value="${today}"></label>${t==='F'?`<label>Fecha límite de pago<input id=due type=date value="${plusDays(today,cfg.paymentDays||30)}"></label>`:''}<label>Cliente<select id=client><option value="">Seleccionar...</option>${clients.map((c,i)=>`<option value=${i}>${esc(c.name)}</option>`).join('')}</select></label><label>Estado<select id=status>${t==='P'?'<option>Pendiente</option><option>Aceptado</option><option>Rechazado</option>':'<option>Pendiente</option><option>Pagada</option>'}</select></label><label>Forma de pago<select id=payment><option>Transferencia</option><option>Efectivo</option><option>Tarjeta</option><option>Domiciliación</option><option>Otro</option></select></label><label class=full>Observaciones<textarea id=notes></textarea></label></div></div><div class=card><h2>Conceptos</h2><div class=small>Descripción · Cantidad · Precio · Descuento % · IVA % · IRPF % · Importe</div><div id=lines></div><button class="btn no-print" onclick="addLine()">＋ Añadir línea</button><div id=totals class=total style="margin-top:15px"></div><div class="actions no-print"><button class="btn primary" onclick="saveDoc('${t}')">Guardar</button><button class=btn onclick="go('${t==='P'?'Presupuestos':'Facturas'}')">Cancelar</button></div></div>`;addLine()}
function addLine(pref={}){let sv=S.get('services'),cfg=CFG(),d=document.createElement('div');d.className='docrow';d.style.cssText='display:grid;grid-template-columns:2fr .6fr .8fr .7fr .6fr .6fr .9fr auto;gap:6px;align-items:end;margin:10px 0';d.innerHTML=`<label>Descripción<select onchange="pickService(this)"><option value="">Escribir...</option>${sv.map((s,i)=>`<option value=${i}>${esc(s.name)}</option>`).join('')}</select><input class=desc value="${esc(pref.desc||'')}" placeholder="Descripción"></label><label>Cant.<input class=qty type=number value="${pref.qty??1}" step=.01 oninput=calc()></label><label>Precio €<input class=price type=number value="${pref.price??0}" step=.01 oninput=calc()></label><label>Dto. %<input class=ldisc type=number value="${pref.discount??0}" step=.01 oninput=calc()></label><label>IVA %<input class=lvat type=number value="${pref.vat??cfg.defaultVat??21}" step=.01 oninput=calc()></label><label>IRPF %<input class=lirpf type=number value="${pref.irpf??cfg.defaultIrpf??0}" step=.01 oninput=calc()></label><label>Importe<input class=lamount readonly></label><button class=btn onclick="this.parentElement.remove();calc()">×</button>`;lines.appendChild(d);calc()}
function pickService(sel){let s=S.get('services')[+sel.value];if(s){let r=sel.closest('.docrow');r.querySelector('.desc').value=s.name;r.querySelector('.price').value=s.price;calc()}}
function calc(){let base=0,vatAmount=0,irpfAmount=0,discountAmount=0;document.querySelectorAll('.docrow').forEach(r=>{let q=+r.querySelector('.qty').value||0,p=+r.querySelector('.price').value||0,dp=+r.querySelector('.ldisc').value||0,vp=+r.querySelector('.lvat').value||0,ip=+r.querySelector('.lirpf').value||0,g=q*p,disc=g*dp/100,b=g-disc,v=b*vp/100,ir=b*ip/100,total=b+v-ir;base+=b;discountAmount+=disc;vatAmount+=v;irpfAmount+=ir;r.querySelector('.lamount').value=total.toFixed(2)+' €'});let total=base+vatAmount-irpfAmount;totals.innerHTML=`Base imponible: ${base.toFixed(2)} €<br>Descuentos: ${discountAmount.toFixed(2)} €<br>IVA: ${vatAmount.toFixed(2)} €<br>IRPF: -${irpfAmount.toFixed(2)} €<br><b>Total: ${total.toFixed(2)} €</b>`;return {base,discountAmount,vatAmount,irpfAmount,total}}
function saveDoc(t){let ci=client.value;if(ci===''){alert('Selecciona un cliente.');return}let c=S.get('clients')[+ci],linesA=[...document.querySelectorAll('.docrow')].map(r=>({desc:r.querySelector('.desc').value,qty:+r.querySelector('.qty').value||0,price:+r.querySelector('.price').value||0,discount:+r.querySelector('.ldisc').value||0,vat:+r.querySelector('.lvat').value||0,irpf:+r.querySelector('.lirpf').value||0})).filter(x=>x.desc);if(!linesA.length){alert('Añade al menos un concepto.');return}let sums=calc(),doc={no:nextNo(t),date:date.value,due:t==='F'?due.value:'',client:c,notes:notes.value,lines:linesA,status:status.value,payment:payment.value,paid:t==='F'&&status.value==='Pagada',...sums};let k=t==='P'?'budgets':'invoices',x=S.get(k);x.push(doc);S.set(k,x);viewDoc(t,x.length-1)}
function viewDoc(t,i){let d=S.get(t==='P'?'budgets':'invoices')[i],cfg=CFG(),lines=d.lines||[];app.innerHTML=`<div class="card doc-view"><div style="display:flex;justify-content:space-between;gap:15px"><img src=logo.png style="width:220px;max-width:45%;object-fit:contain"><div style="text-align:right"><b style="font-size:20px">${t==='P'?'PRESUPUESTO':'FACTURA'}</b><div>Emisión: ${d.date}</div>${t==='F'&&d.due?`<div>Vencimiento: ${d.due}</div>`:''}<div class=small>Referencia: ${d.no}</div>${t==='P'?`<div class=small>${esc(cfg.budgetConditions||'Presupuesto válido durante 30 días.')}</div>`:''}</div></div><hr class=doc-rule><div class=grid><div><b>${COMPANY.name}</b><div class=small>${COMPANY.owner}<br>NIF ${COMPANY.nif}<br>${COMPANY.address}<br>${COMPANY.phone} · ${COMPANY.email}</div></div><div class=doc-client><b>Cliente</b><div>${esc(d.client?.name||'Sin nombre')}</div><div class=small>${esc(d.client?.nif||'')}<br>${esc(d.client?.address||'')} ${esc(d.client?.city||'')}<br>${esc(d.client?.phone||'')} · ${esc(d.client?.email||'')}${d.client?.workAddress?'<br>Trabajo: '+esc(d.client.workAddress):''}</div></div></div><div style="margin-top:20px;overflow:auto"><table class=doc-table style="width:100%;border-collapse:collapse;table-layout:fixed">
<colgroup><col style="width:46%"><col style="width:7%"><col style="width:11%"><col style="width:7%"><col style="width:7%"><col style="width:7%"><col style="width:15%"></colgroup>
<tr><th align=left>Descripción</th><th>Cant.</th><th>Precio</th><th>Dto.</th><th>IVA</th><th>IRPF</th><th>Importe</th></tr>${lines.map(l=>{let b=(l.qty*l.price)*(1-(l.discount||0)/100),amt=b*(1+(l.vat??d.vat??21)/100-(l.irpf||0)/100);return `<tr><td>${esc(l.desc)}</td><td align=center>${l.qty}</td><td align=right>${(+l.price).toFixed(2)} €</td><td align=center>${l.discount||0}%</td><td align=center>${l.vat??d.vat??21}%</td><td align=center>${l.irpf||0}%</td><td align=right>${amt.toFixed(2)} €</td></tr>`}).join('')}</table></div><div class="doc-footer"><div class="doc-footer-left">${t==='P'?`<div><b>Forma de pago:</b> ${esc(d.payment||'Transferencia')}</div>`:((d.payment||'Transferencia')==='Transferencia'&&cfg.iban?`<div class=doc-payment><b>Información de pago</b><br>Titular: ${esc(cfg.bankOwner||COMPANY.owner)}<br>IBAN: ${esc(cfg.iban)}${cfg.bic?'<br>BIC/SWIFT: '+esc(cfg.bic):''}<br>Concepto: ${d.no}</div>`:`<div><b>Forma de pago:</b> ${esc(d.payment||'Transferencia')}</div>`)}</div><div class=total>Base: ${(+d.base||0).toFixed(2)} €<br>IVA: ${(+d.vatAmount||0).toFixed(2)} €<br>IRPF: -${(+d.irpfAmount||0).toFixed(2)} €<br><b>Total: ${(+d.total||0).toFixed(2)} €</b></div></div>${d.notes?`<p><b>Observaciones:</b><br>${esc(d.notes)}</p>`:''}${d.signature?`<p><b>Firma:</b><br><img src="${d.signature}" style="max-width:260px"></p>`:''}${t==='F'&&d.showPaymentsOnDoc?paymentBlock(d,i):''}<div class="actions no-print">${t==='F'?`<button class=btn onclick="togglePaymentsOnDoc(${i})">${d.showPaymentsOnDoc?'🙈 Ocultar cobros en documento':'💶 Mostrar cobros en documento'}</button>`:''}<button class="btn primary" onclick="shareDocPDF('${t}',${i})">📤 Imprimir / Mail / Guardar</button><button class=btn onclick="openDocPDF('${t}',${i})">👁️ Ver PDF</button><button class=btn onclick="sharePDF('${t}',${i})">📲 WhatsApp PDF</button>${t==='P'?`<button class="btn primary" onclick="acceptBudget(${i})">✅ Aceptado → Crear factura</button>`:''}<button class=btn onclick="signDoc('${t}',${i})">✍️ Firma</button><button class=btn onclick="shareWhatsApp('${t}',${i})">💬 Mensaje WhatsApp</button><button class=btn onclick="go('${t==='P'?'Presupuestos':'Facturas'}')">Volver</button></div></div>`}
function togglePaymentsOnDoc(i){
  let x=S.get('invoices'),d=x[i];
  d.showPaymentsOnDoc=!d.showPaymentsOnDoc;
  x[i]=d;S.set('invoices',x);viewDoc('F',i)
}
function duplicateDoc(t,i){
  let k=t==='P'?'budgets':'invoices',x=S.get(k),src=x[i],cfg=CFG(),today=new Date().toISOString().slice(0,10);
  let copy=JSON.parse(JSON.stringify(src));
  copy.no=nextNo(t); copy.date=today; copy.signature='';
  if(t==='F'){copy.due=plusDays(today,cfg.paymentDays||30);copy.status='Pendiente';copy.paid=false;copy.payments=[]}
  else {copy.status='Pendiente'}
  x.push(copy);S.set(k,x);viewDoc(t,x.length-1);
}
function acceptBudget(i){
 let b=S.get('budgets')[i];
 if(b.invoiceNo){alert('Este presupuesto ya generó la factura '+b.invoiceNo+'.');return}
 if(!confirm('¿Marcar este presupuesto como aceptado y crear automáticamente su factura?'))return;
 let cfg=CFG(),today=new Date().toISOString().slice(0,10),inv=S.get('invoices'),no=nextNo('F');
 let f={...JSON.parse(JSON.stringify(b)),no,date:today,due:plusDays(today,cfg.paymentDays||30),status:'Pendiente',paid:false,payments:[],signature:'',sourceBudget:b.no,notes:(b.notes?b.notes+'\n':'')+'Procedente del presupuesto '+b.no};
 inv.push(f);S.set('invoices',inv);
 let bs=S.get('budgets');bs[i].status='Aceptado';bs[i].acceptedDate=today;bs[i].invoiceNo=no;S.set('budgets',bs);
 page='Facturas';tabs();viewDoc('F',inv.length-1)
}
function toInvoice(i){
 let bs=S.get('budgets'),b=bs[i];
 if(b.invoiceNo){alert('Este presupuesto ya generó la factura '+b.invoiceNo+'.');return}
 if(!confirm('¿Convertir este presupuesto en factura?'))return;
 let x=S.get('invoices'),cfg=CFG(),today=new Date().toISOString().slice(0,10),no=nextNo('F');
 x.push({...JSON.parse(JSON.stringify(b)),no,date:today,due:plusDays(today,cfg.paymentDays||30),status:'Pendiente',paid:false,payments:[],signature:'',sourceBudget:b.no,notes:(b.notes?b.notes+'\n':'')+'Procedente del presupuesto '+b.no});
 S.set('invoices',x);bs[i].status='Aceptado';bs[i].acceptedDate=bs[i].acceptedDate||today;bs[i].invoiceNo=no;S.set('budgets',bs);
 page='Facturas';tabs();viewDoc('F',x.length-1)
}
function togglePaid(i){let x=S.get('invoices');x[i].paid=!x[i].paid;x[i].status=x[i].paid?'Pagada':'Pendiente';S.set('invoices',x);listDocs('F')}

  function watermark(){
    // Emblema circular abajo a la derecha en todas las páginas; la página lo recorta.
    pdf.addImage(BRAND_MARK,'PNG',148,180,76,78,'sg_emblema', 'FAST');
  }
  function columnHead(){
    pdf.setFillColor(...GREEN);pdf.rect(L,y,R-L,10,'F');
    pdf.setFont('helvetica','bold');pdf.setFontSize(7.2);pdf.setTextColor(255,255,255);
    pdf.text('DESCRIPCIÓN',L+2,y+6.3);
    pdf.text('CANT.',124,y+6.3,{align:'right'});
    pdf.text('PRECIO',144,y+6.3,{align:'right'});
    pdf.text('DTO.',155,y+6.3,{align:'right'});
    pdf.text('IVA',168,y+6.3,{align:'right'});
    pdf.text('IRPF',179,y+6.3,{align:'right'});
    pdf.text('IMPORTE',right,y+6.3,{align:'right'});
    y+=11;pdf.setTextColor(...DARK);
  }
  function continuation(){
    pdf.addPage();y=15;watermark();columnHead();
  }
  watermark();
  // Cabecera de la primera página: logotipo horizontal original, a todo color.
  try{pdf.addImage(BRAND_FULL,'JPEG',L,10,88,31.3,'sg_logo_full','FAST')}
  catch(e){console.warn('PDF: logo corporativo no disponible',e)}
  pdf.setTextColor(...DARK);pdf.setFont('helvetica','bold');pdf.setFontSize(18);
  pdf.text(t==='P'?'PRESUPUESTO':'FACTURA',R,22,{align:'right'});
  pdf.setFont('helvetica','normal');pdf.setFontSize(9);
  pdf.text('Número: '+tx(d.no),R,29,{align:'right'});
  pdf.text('Emisión: '+tx(d.date),R,35,{align:'right'});
  if(t==='F'&&d.due)pdf.text('Vencimiento: '+tx(d.due),R,41,{align:'right'});
  y=51;pdf.setDrawColor(...GREEN);pdf.setLineWidth(1);pdf.line(L,y,R,y);y+=7;
  pdf.setFont('helvetica','bold');pdf.setFontSize(9.7);
  pdf.text('SERÓN GROUNDS',L,y);pdf.text('CLIENTE',108,y);y+=5.5;
  pdf.setFont('helvetica','normal');pdf.setFontSize(8.6);
  const co=[COMPANY.owner,'NIF: '+COMPANY.nif,COMPANY.address,COMPANY.phone+' · '+COMPANY.email];
  const c=d.client||{};
  const cl=[c.name||'Cliente no indicado',c.nif||'',c.address||'',c.city||'',c.phone||'',c.email||'',c.workAddress?'Trabajo: '+c.workAddress:''].filter(Boolean);
  let yc=y,yd=y;
  for(const v of co){const parts=wrap(v,89);pdf.text(parts,L,yc);yc+=parts.length*4.3+0.5}
  for(const v of cl){const parts=wrap(v,88);pdf.text(parts,108,yd);yd+=parts.length*4.3+0.5}
  y=Math.max(yc,yd)+7;
  if(t==='P'){
    const conditions=CFG().budgetConditions||'Presupuesto válido durante 30 días.';
    const txtLines=wrap(conditions,R-L);
    pdf.setFontSize(8);pdf.text(txtLines,L,y);y+=txtLines.length*4.2+5;
  }
  columnHead();
  const rows=Array.isArray(d.lines)?d.lines:[];
  for(const line of rows){
    const desc=wrap(line.desc||'',100);
    const height=Math.max(9,desc.length*4.6+4);
    if(y+height>H-22)continuation();
    pdf.setFont('helvetica','normal');pdf.setFontSize(8);pdf.setTextColor(34,56,36);
    pdf.text(desc,L+2,y+5);
    const qty=Number(line.qty)||0,price=Number(line.price)||0,discount=Number(line.discount)||0;
    const vat=Number(line.vat??21),irpf=Number(line.irpf)||0;
    const amount=qty*price*(1-discount/100)*(1+vat/100-irpf/100);
    pdf.setFontSize(7.5);
    pdf.text(tx(qty),124,y+5,{align:'right'});
    pdf.text(fmt(price),144,y+5,{align:'right'});
    pdf.text(tx(discount)+'%',155,y+5,{align:'right'});
    pdf.text(tx(vat)+'%',168,y+5,{align:'right'});
    pdf.text(tx(irpf)+'%',179,y+5,{align:'right'});
    pdf.text(fmt(amount),right,y+5,{align:'right'});
    y+=height;pdf.setDrawColor(226,236,223);pdf.setLineWidth(.2);pdf.line(L,y,R,y);
  }
  // Totals stay immediately AFTER the last concept, on the LAST page.
  // Reserve the correct space before adding another page to avoid overlap.
  const cfg=CFG(),paymentInfo=[];
  if(t==='F'){
    paymentInfo.push('Forma de pago: '+tx(d.payment||'Transferencia'));
    if((d.payment||'Transferencia')==='Transferencia'&&cfg.iban){
      paymentInfo.push('Titular: '+tx(cfg.bankOwner||COMPANY.owner));
      paymentInfo.push('IBAN: '+tx(cfg.iban));
      if(cfg.bic)paymentInfo.push('BIC/SWIFT: '+tx(cfg.bic));
      paymentInfo.push('Concepto: '+tx(d.no));
    }
  }
  const paymentLines=paymentInfo.flatMap(v=>wrap(v,172));
  const paymentH=t==='F'?Math.max(12,paymentLines.length*4.1+9):0;
  const noteLines=d.notes?wrap('Observaciones: '+tx(d.notes),R-L):[];
  const noteH=noteLines.length?noteLines.length*4.2+8:0;
  const totalsH=37;
  const finalH=totalsH+paymentH+(t==='F'?5:0)+noteH+4;
  if(y+finalH>H-18)continuation();
  y+=5;
  // Soft green totals panel aligned to right; visibly larger total.
  pdf.setFillColor(241,249,237);pdf.roundedRect(137,y,62,31,2,2,'F');
  const values=[['Base imponible',d.base],['IVA',d.vatAmount],['IRPF',-(Number(d.irpfAmount)||0)]];
  pdf.setFont('helvetica','normal');pdf.setFontSize(8.4);pdf.setTextColor(...DARK);
  let yy=y+6.5;
  for(const [label,value] of values){pdf.text(label+':',140,yy);pdf.text(cash(value),196,yy,{align:'right'});yy+=5.6}
  pdf.setFont('helvetica','bold');pdf.setFontSize(11.3);pdf.setTextColor(32,106,38);
  pdf.text('TOTAL',140,y+27);pdf.text(cash(d.total),196,y+27,{align:'right'});
  y+=totalsH;
  if(t==='F'){
    y+=2;pdf.setFillColor(238,248,234);pdf.roundedRect(L,y,R-L,paymentH,2,2,'F');
    pdf.setTextColor(...DARK);pdf.setFont('helvetica','bold');pdf.setFontSize(8);
    pdf.text('INFORMACIÓN DE PAGO',L+3,y+5);
    pdf.setFont('helvetica','normal');pdf.setFontSize(8);
    let py=y+9;
    for(const line of paymentLines){pdf.text(line,L+3,py);py+=4.1}
    y+=paymentH+3;
  }
  if(noteLines.length){
    pdf.setTextColor(...DARK);pdf.setFont('helvetica','normal');pdf.setFontSize(8);
    pdf.text(noteLines,L,y+4);y+=noteH;
  }
  const numPages=pdf.internal.getNumberOfPages();
  for(let k=1;k<=numPages;k++){
    pdf.setPage(k);pdf.setFontSize(7);pdf.setFont('helvetica','normal');pdf.setTextColor(105,126,106);
    pdf.text('SERÓN GROUNDS  ·  Página '+k+' de '+numPages,R,289,{align:'right'});
  }
  const name=(t==='P'?'Presupuesto_':'Factura_')+tx(d.no||i+1).replace(/[^a-z0-9_-]/gi,'_')+'.pdf';
  return {blob:pdf.output('blob'),name};
}
async function sharePDF(t,i){
  try{
    const p=await buildDocPDF(t,i);
    const file=new File([p.blob],p.name,{type:'application/pdf'});
    if(navigator.share&&(!navigator.canShare||navigator.canShare({files:[file]}))){
      await navigator.share({files:[file],title:p.name});
    }else{
      const u=URL.createObjectURL(p.blob),a=document.createElement('a');
      a.href=u;a.download=p.name;document.body.appendChild(a);a.click();a.remove();
      setTimeout(()=>URL.revokeObjectURL(u),30000);
      alert('PDF preparado. Ya puedes compartirlo por WhatsApp.');
    }
  }catch(e){

async function sgAccessToken(){
 if(!sgSession?.access_token)throw Error('Inicia sesión primero.');
 if(sgSession.expires_at&&Date.now()/1000>sgSession.expires_at-90){
  if(!sgSession.refresh_token)throw Error('La sesión ha caducado. Vuelve a entrar.');
  sgSession=await sgAuthRequest('token?grant_type=refresh_token',{refresh_token:sgSession.refresh_token});
  sessionStorage.setItem('sg_auth_session',JSON.stringify(sgSession));
 }
 return sgSession.access_token;
}
async function sgTable(table,method,query,data){
 const token=await sgAccessToken();
 const r=await fetch(SUPABASE_URL+'/rest/v1/'+table+(query?'?'+query:''),{method,headers:{apikey:SUPABASE_KEY,Authorization:'Bearer '+token,'Content-Type':'application/json',Accept:'application/json',Prefer:'return=representation'},body:data?JSON.stringify(data):undefined,cache:'no-store'});
 const raw=await r.text();let obj;try{obj=raw?JSON.parse(raw):[]}catch{obj=raw}
 if(!r.ok)throw Error((obj&&obj.message)||raw||'Error HTTP '+r.status);return obj;
}
/* Huella estable del contenido: nunca usar el número como ID exclusivo.
   Los presupuestos históricos P-2026-NaN son documentos diferentes. */
function sgCanonical(value){
 if(Array.isArray(value))return '['+value.map(sgCanonical).join(',')+']';
 if(value&&typeof value==='object')return '{'+Object.keys(value).sort().map(k=>JSON.stringify(k)+':'+sgCanonical(value[k])).join(',')+'}';
 return JSON.stringify(value===undefined?null:value);
}
function sgIdentity(k,item){return k+':'+sgCanonical(item)}
function sgMergeCopies(k,base,incoming){
 if(!Array.isArray(base)||!Array.isArray(incoming))throw Error('Los datos '+k+' no son listas válidas.');
 const output=base.slice(),known=new Set(base.map(v=>sgIdentity(k,v)));
 for(const item of incoming){
  if(!item||typeof item!=='object'||Array.isArray(item))throw Error('Registro no válido en '+k);
  let id=sgIdentity(k,item);
  if(!known.has(id)){output.push(item);known.add(id)}
 }
 return output;
}
function sgBackupShape(data){
 const local=data&&typeof data==='object'?(data.local&&typeof data.local==='object'?data.local:data):null;
 if(!local||!['clients','budgets','invoices'].every(k=>Array.isArray(local[k])))throw Error('La copia no tiene clientes, presupuestos y facturas válidos.');
 return local;
}
function sgReadBackupFile(input){
 const file=input.files?.[0];if(!file)return;
 const reader=new FileReader();
 reader.onload=()=>{try{
  const src=sgBackupShape(JSON.parse(reader.result));
  const count=['clients','budgets','invoices'].map(k=>k+': '+src[k].length+' → '+sgMergeCopies(k,S.get(k,[]),src[k]).length).join(' | ');
  if(!confirm('Vista previa de la unión (actual → tras unir):\n'+count+'\n\nSe CONSERVAN los registros actuales. Los documentos con el mismo número pero distinto contenido también se conservan.\n\n¿Unir esta copia SOLO en este dispositivo?'))return;
  // Escribir únicamente después de validar todo; preservar instantáneas locales para recuperación.
  const merged={};for(const k of ['clients','budgets','invoices'])merged[k]=sgMergeCopies(k,S.get(k,[]),src[k]);
  const snapshot={date:new Date().toISOString(),before:{clients:S.get('clients',[]),budgets:S.get('budgets',[]),invoices:S.get('invoices',[])}};
  const snapshots=S.get('sg_merge_snapshots',[]);snapshots.push(snapshot);S.set('sg_merge_snapshots',snapshots.slice(-5));
  for(const k of ['clients','budgets','invoices'])S.set(k,merged[k]);
  sgStatus('Copia unida en este dispositivo: '+count+'. Supabase sin cambios.');
  alert('Unión local completada. Revisa los documentos y exporta una copia antes de sincronizar.');
 }catch(e){sgStatus('No se ha importado la copia: '+e.message);alert('No se ha importado: '+e.message)}finally{input.value=''}};
 reader.readAsText(file);
}
async function sgSync(){
 try{
  await sgAccessToken();
  if(!confirm('La sincronización enviará registros a Supabase y descargará los que falten.\n\n¿Has exportado una copia de seguridad ACTUAL de este iPhone?'))return;
  const configs=[['clients','sg_clients'],['budgets','sg_budgets'],['invoices','sg_invoices']];
  const token=await sgAccessToken();
  const userRes=await fetch(SUPABASE_URL+'/auth/v1/user',{headers:{apikey:SUPABASE_KEY,Authorization:'Bearer '+token}});
  if(!userRes.ok)throw Error('No se pudo identificar al usuario.');
  const profile=await userRes.json();if(!profile.id)throw Error('La sesión no tiene identificador de usuario.');
  // PRELECTURA COMPLETA: si falla una tabla, no se sube ninguna.
  let plans=[];
  for(const [k,table] of configs){
   sgStatus('Comprobando '+k+'…');
   const local=S.get(k,[]);
   if(!Array.isArray(local))throw Error('Datos locales inválidos en '+k);
   const rows=await sgTable(table,'GET','select=id,owner_id,data,updated_at&limit=10000');
   if(!Array.isArray(rows))throw Error('Respuesta inesperada de '+table);
   if(rows.length===10000)throw Error('Demasiados registros en '+table+'. Se requiere paginación.');
   if(rows.some(r=>r.owner_id!==profile.id||!r.data||typeof r.data!=='object'))throw Error('Propietario o formato inesperado en '+table);
   const remote=rows.map(r=>r.data),localKeys=new Set(local.map(item=>sgIdentity(k,item)));
   const remoteKeys=new Set(remote.map(item=>sgIdentity(k,item)));
   const upload=local.filter(item=>!remoteKeys.has(sgIdentity(k,item)));
   const merged=sgMergeCopies(k,local,remote);
   plans.push({k,table,local,upload,merged,download:merged.length-local.length});
  }
  const overview=plans.map(p=>p.k+': subir '+p.upload.length+', recibir '+p.download).join('\n');
  if(!confirm('Revisión previa:\n'+overview+'\n\nSe preservan variantes y documentos con numeración repetida. ¿Continuar?'))return;
  // Idempotencia por lectura previa: nunca sobrescribir registros existentes.
  for(const plan of plans){
   sgStatus('Enviando '+plan.k+'…');
   for(const item of plan.upload)await sgTable(plan.table,'POST','',{owner_id:profile.id,data:item,updated_at:new Date().toISOString()});
  }
  // Volver a leer antes de modificar almacenamiento local. Un fallo no toca los datos originales.
  const final={};
  for(const p of plans){
   const rows=await sgTable(p.table,'GET','select=id,owner_id,data&limit=10000');
   if(!Array.isArray(rows))throw Error('No se pudieron confirmar los datos en '+p.table);
   final[p.k]=sgMergeCopies(p.k,S.get(p.k,[]),rows.map(r=>r.data));
  }
  const snap={date:new Date().toISOString(),before:{clients:S.get('clients',[]),budgets:S.get('budgets',[]),invoices:S.get('invoices',[])}};
  const snaps=S.get('sg_merge_snapshots',[]);snaps.push(snap);S.set('sg_merge_snapshots',snaps.slice(-5));
  for(const k of ['clients','budgets','invoices'])S.set(k,final[k]);
  sgStatus('Sincronización completada. '+overview.replace(/\n/g,' · ')+'. Conserva tu copia externa.');
 }catch(e){sgStatus('Sincronización detenida: '+e.message+'. No se han borrado datos locales. Comprueba Supabase antes de repetir.');console.warn('Sincronización:',e)}
}

function money(n){return (+n||0).toFixed(2)+' €'}
function paymentsOf(d){return Array.isArray(d.payments)?d.payments:[]}
function paidAmount(d){if(d.paid&&!paymentsOf(d).length)return +d.total||0;return Math.min(+d.total||0,paymentsOf(d).reduce((a,p)=>a+(+p.amount||0),0))}

function invoiceState(d){let paid=paidAmount(d),total=+d.total||0;if(total>0&&paid>=total-.005)return 'Pagada';if(paid>0)return 'Parcialmente pagada';if(d.due&&d.due<new Date().toISOString().slice(0,10))return 'Vencida';return 'Pendiente'}
function addPayment(i){let x=S.get('invoices'),d=x[i],pending=pendingAmount(d);if(pending<=0){alert('Esta factura ya está pagada.');return}let mode=prompt('Escribe % para porcentaje o € para importe. Ejemplo: 65% o 350€','65%');if(!mode)return;let amount=0,m=mode.replace(',','.').trim();if(m.includes('%'))amount=(+m.replace('%','')||0)/100*(+d.total||0);else amount=+m.replace('€','').trim()||0;if(amount<=0){alert('Importe no válido.');return}amount=Math.min(amount,pending);let method=prompt('Forma de pago: Transferencia, Efectivo, Tarjeta, Domiciliación u Otro',d.payment||'Transferencia')||d.payment||'Transferencia';d.payments=paymentsOf(d);d.payments.push({date:new Date().toISOString().slice(0,10),amount,method});d.paid=pendingAmount(d)<=.005;d.status=invoiceState(d);S.set('invoices',x);viewDoc('F',i)}

    <label>Estado<select id=status>${t==='P'

    <label>Forma de pago<select id=payment>${['Transferencia','Efectivo','Tarjeta','Domiciliación','Otro'].map(s=>`<option ${s===(d.payment||'Transferencia')?'selected':''}>${s}</option>`).join('')}</select></label>
    <label class=full>Observaciones<textarea id=notes>${esc(d.notes||'')}</textarea></label>
  </div></div>

  <div id=lines></div><button class="btn no-print" onclick="addLine()">＋ Añadir línea</button>
  <div id=totals class=total style="margin-top:15px"></div>

  <button class=btn onclick="viewDoc('${t}',${i})">Cancelar</button></div></div>`;
  (d.lines||[]).forEach(l=>addLine(l));
  if(!(d.lines||[]).length)addLine();

function updateDoc(t,i){
  let ci=client.value;
  if(ci===''){alert('Selecciona un cliente.');return}
  let newNo=(docno.value||'').trim().toUpperCase();
  if(!newNo){alert('La referencia no puede quedar vacía.');docno.focus();return}
  let k=t==='P'?'budgets':'invoices',x=S.get(k);
  if(x.some((d,j)=>j!==i&&String(d.no||'').trim().toUpperCase()===newNo)){
    alert('Ya existe otro '+(t==='P'?'presupuesto':'factura')+' con la referencia '+newNo+'. Elige otra referencia.');
    docno.focus();return
  }
  let c=S.get('clients')[+ci];
  let linesA=[...document.querySelectorAll('.docrow')].map(r=>({
    desc:r.querySelector('.desc').value,
    qty:+r.querySelector('.qty').value||0,
    price:+r.querySelector('.price').value||0,
    discount:+r.querySelector('.ldisc').value||0,
    vat:+r.querySelector('.lvat').value||0,
    irpf:+r.querySelector('.lirpf').value||0
  })).filter(x=>x.desc);
  if(!linesA.length){alert('Añade al menos un concepto.');return}
  let sums=calc(),old=x[i];
  x[i]={
    ...old,
    no:newNo,
    date:date.value,
    due:t==='F'?due.value:'',
    client:c,
    notes:notes.value,
    lines:linesA,
    status:status.value,
    payment:payment.value,
    paid:t==='F' ? (status.value==='Pagada' ? true : (paymentsOf(old).length ? paidAmount(old)>=sums.total-.005 : false)) : old.paid,
    ...sums
  };
  if(t==='F' && status.value==='Pagada' && !paymentsOf(x[i]).length){
    x[i].payments=[{date:new Date().toISOString().slice(0,10),amount:sums.total,method:payment.value}];
  }
  S.set(k,x);
  viewDoc(t,i);
}

function adminClockDuration(a,b){
 if(!a)return '—';if(!b)return 'En curso';
 let m=Math.max(0,Math.round((new Date(b)-new Date(a))/60000));
 return Math.floor(m/60)+' h '+(m%60)+' min';
}
function adminClockMinutes(a,b){if(!a||!b)return 0;return Math.max(0,Math.round((new Date(b)-new Date(a))/60000))}
function adminDate(v){try{return new Date(v).toLocaleDateString('es-ES',{day:'2-digit',month:'2-digit',year:'numeric'})}catch{return v||'—'}}

function clockOut(){if(!pworker.value){alert('Selecciona el trabajador.');return}let x=S.get('clockings'),idx=-1;for(let i=x.length-1;i>=0;i--)if(x[i].workerId===pworker.value&&!x[i].outTime){idx=i;break}if(idx<0){alert('No tienes ningún fichaje abierto.');return}x[idx].outTime=new Date().toTimeString().slice(0,5);S.set('clockings',x);alert('Salida registrada. '+clockDuration(x[idx]));showWorkerRecent();if(document.getElementById('jobTeamBox')&&pjob.value===x[idx].jobId)showJobTeam()}
function saveWorkerIncident(){if(!pworker.value||!pjob.value){alert('Selecciona trabajador y jardín/trabajo.');return}if(!pnotes.value.trim()&&![...pphotos.files].length){alert('Escribe qué se ha realizado, qué falta o añade una foto.');return}let files=[...pphotos.files].slice(0,4),photos=[],finish=()=>{let j=selectedWorkerJob(),x=S.get('workerIncidents');x.push({id:'I'+Date.now(),workerId:pworker.value,jobId:j.id,jobName:j.name,jobKind:j.kind,date:new Date().toISOString(),result:presult.value,notes:pnotes.value.trim(),photos,status:'Nueva'});S.set('workerIncidents',x);alert('Registro guardado.');workerPortal()};if(!files.length)return finish();let left=files.length;files.forEach(f=>{let r=new FileReader;r.onload=()=>{photos.push(r.result);if(!--left)finish()};r.readAsDataURL(f)})}
function workerIncidentHtml(r){return `<div class=item><b>${new Date(r.date).toLocaleString('es-ES')} · ${esc(r.jobName)}</b><div>${esc(r.result)} · <b>${esc(r.status||'Nueva')}</b></div><div class=small>${esc(r.notes||'')}</div>${(r.photos||[]).map(p=>`<img src="${p}" style="width:90px;height:90px;object-fit:cover;border-radius:9px;margin:6px">`).join('')}</div>`}
function showWorkerRecent(){let id=pworker.value,cl=S.get('clockings').filter(c=>c.workerId===id).slice(-5).reverse(),inc=S.get('workerIncidents').filter(c=>c.workerId===id).slice(-5).reverse();workerRecent.innerHTML=(cl.map(c=>`<div class=item>⏱️ ${c.date} · ${esc(c.jobName)} · ${c.inTime||'—'} → ${c.outTime||'En curso'} · ${clockDuration(c)}</div>`).join('')+inc.map(workerIncidentHtml).join(''))||'Todavía no hay registros.'}

if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});tabs();render();syncPortalData();loadPalmTreatments().then(()=>{if(page==='Inicio')render()}).catch(()=>{});
</script></body></html>
