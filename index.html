<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SERÓN GROUNDS</title><link rel="manifest" href="manifest.json"><style>
:root{--g:#173f2a;--g2:#2f6b43;--bg:#f4f6f2;--card:#fff;--mut:#657067}*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:#172018}header{background:var(--g);color:#fff;padding:12px 16px;display:flex;align-items:center;gap:14px;position:sticky;top:0;z-index:3}header img{width:62px;height:42px;object-fit:contain;background:#fff;border-radius:8px}header b{font-size:20px}.wrap{max-width:1050px;margin:auto;padding:16px}.tabs{display:flex;gap:8px;overflow:auto;margin-bottom:16px}.tabs button,.btn{border:0;border-radius:10px;padding:11px 14px;background:#e2e8e1;font-weight:700}.tabs button.active,.btn.primary{background:var(--g);color:#fff}.card{background:#fff;border-radius:14px;padding:16px;margin-bottom:14px;box-shadow:0 2px 10px #0000000b}h2{margin:0 0 14px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}label{font-size:13px;font-weight:700;color:var(--mut)}input,textarea,select{width:100%;padding:11px;border:1px solid #ccd4cc;border-radius:9px;margin-top:5px;font:inherit}textarea{min-height:80px}.full{grid-column:1/-1}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.row{display:grid;grid-template-columns:2fr .6fr .8fr auto;gap:8px;align-items:end;margin:8px 0}.total{font-size:20px;font-weight:800;text-align:right}.item{padding:12px 0;border-bottom:1px solid #edf0ed}.small{font-size:13px;color:var(--mut)}.home{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.home button{min-height:100px;font-size:17px}.hidden{display:none}@media(max-width:650px){.grid{grid-template-columns:1fr}.row{grid-template-columns:1fr 70px 90px auto}.home{grid-template-columns:1fr 1fr}header b{font-size:17px}}
@media print{header,.tabs,.no-print{display:none!important}.wrap{padding:0}.card{box-shadow:none}.hidden{display:none!important}}
</style></head><body><header><img src="logo.png"><div><b>SERÓN GROUNDS</b><div style="font-size:12px">Servicios Integrales de Jardinería</div></div></header><div class="wrap"><div class="tabs no-print" id="tabs"></div><main id="app"></main></div><script>
const COMPANY={name:'SERÓN GROUNDS SERVICIOS INTEGRALES DE JARDINERÍA',owner:'Miguel Ángel Serón Rodríguez',nif:'77236704J',phone:'644 039 107',email:'Info@serongrounds.es',address:'Avenida Alcalde Antonio Solano, 29120 Alhaurín el Grande, Málaga'};
const S={get(k,d=[]){return JSON.parse(localStorage.getItem(k)||JSON.stringify(d))},set(k,v){localStorage.setItem(k,JSON.stringify(v))}};
let page='Inicio'; const pages=['Inicio','Clientes','Presupuestos','Facturas','Servicios'];
function tabs(){document.getElementById('tabs').innerHTML=pages.map(p=>`<button class="${p===page?'active':''}" onclick="go('${p}')">${p}</button>`).join('')}
function go(p){page=p;tabs();render()}; function esc(s=''){return String(s).replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function nextNo(type){let y=new Date().getFullYear(), key=type==='P'?'budgets':'invoices', arr=S.get(key); let nums=arr.filter(x=>x.no?.startsWith(type+'-'+y+'-')).map(x=>+x.no.split('-').pop()); return `${type}-${y}-${String((Math.max(0,...nums)+1)).padStart(3,'0')}`}
function render(){let a=document.getElementById('app'); if(page==='Inicio') a.innerHTML=`<div class=card><h2>Panel principal</h2><div class=home><button class="btn primary" onclick="newDoc('P')">＋ Nuevo presupuesto</button><button class="btn primary" onclick="newDoc('F')">＋ Nueva factura</button><button class=btn onclick="go('Clientes')">👤 Clientes</button><button class=btn onclick="go('Servicios')">🌿 Servicios</button></div></div><div class=card><b>${COMPANY.owner}</b><div class=small>${COMPANY.nif} · ${COMPANY.phone}<br>${COMPANY.email}<br>${COMPANY.address}</div></div>`; else if(page==='Clientes') clients(); else if(page==='Servicios') services(); else listDocs(page==='Presupuestos'?'P':'F')}
function clients(){let x=S.get('clients');app.innerHTML=`<div class=card><h2>Clientes</h2><div class=grid><label>Nombre<input id=cn></label><label>NIF/CIF<input id=ci></label><label>Teléfono<input id=cp></label><label>Email<input id=ce></label><label class=full>Dirección<input id=ca></label></div><div class=actions><button class="btn primary" onclick="addClient()">Guardar cliente</button></div></div><div class=card>${x.length?x.map((c,i)=>`<div class=item><b>${esc(c.name)}</b><div class=small>${esc(c.nif)} · ${esc(c.phone)}<br>${esc(c.address)}</div><button class="btn no-print" onclick="del('clients',${i})">Eliminar</button></div>`).join(''):'Todavía no hay clientes.'}</div>`}
function addClient(){let x=S.get('clients');x.push({name:cn.value,nif:ci.value,phone:cp.value,email:ce.value,address:ca.value});S.set('clients',x);clients()}function del(k,i){let x=S.get(k);x.splice(i,1);S.set(k,x);render()}
function services(){let x=S.get('services',[{name:'Mantenimiento de jardín',price:0},{name:'Poda',price:0},{name:'Desbroce',price:0},{name:'Limpieza de parcela',price:0},{name:'Instalación / reparación de riego',price:0},{name:'Plantación',price:0},{name:'Césped',price:0},{name:'Tratamientos',price:0},{name:'Mano de obra',price:0},{name:'Materiales',price:0}]);if(!localStorage.services)S.set('services',x);app.innerHTML=`<div class=card><h2>Servicios</h2><div class=grid><label>Concepto<input id=sn></label><label>Precio habitual (€)<input id=sp type=number step=.01></label></div><div class=actions><button class="btn primary" onclick="addService()">Añadir servicio</button></div></div><div class=card>${x.map((s,i)=>`<div class=item><b>${esc(s.name)}</b> <span class=small>${(+s.price).toFixed(2)} €</span><button class="btn no-print" onclick="del('services',${i})">Eliminar</button></div>`).join('')}</div>`}
function addService(){let x=S.get('services');x.push({name:sn.value,price:+sp.value||0});S.set('services',x);services()}
function listDocs(t){let k=t==='P'?'budgets':'invoices',x=S.get(k);app.innerHTML=`<div class=card><h2>${t==='P'?'Presupuestos':'Facturas'}</h2><button class="btn primary no-print" onclick="newDoc('${t}')">＋ Nuevo</button></div><div class=card>${x.length?x.slice().reverse().map((d,ri)=>{let i=x.length-1-ri;return `<div class=item><b>${d.no}</b> — ${esc(d.client.name||'Sin cliente')}<div class=small>${d.date} · Total: ${d.total.toFixed(2)} €</div><div class=actions no-print><button class=btn onclick="viewDoc('${t}',${i})">Ver / imprimir</button>${t==='P'?`<button class=btn onclick="toInvoice(${i})">Convertir en factura</button>`:''}<button class=btn onclick="del('${k}',${i})">Eliminar</button></div></div>`}).join(''):'Todavía no hay documentos.'}</div>`}
function newDoc(t){let clients=S.get('clients'),sv=S.get('services');app.innerHTML=`<div class=card><h2>Nuevo ${t==='P'?'presupuesto':'factura'} · ${nextNo(t)}</h2><div class=grid><label>Fecha<input id=date type=date value="${new Date().toISOString().slice(0,10)}"></label><label>Cliente<select id=client><option value="">Seleccionar...</option>${clients.map((c,i)=>`<option value=${i}>${esc(c.name)}</option>`).join('')}</select></label><label class=full>Observaciones<textarea id=notes></textarea></label></div></div><div class=card><h2>Conceptos</h2><div id=lines></div><button class="btn no-print" onclick="addLine()">＋ Añadir línea</button><div class=grid style="margin-top:15px"><label>IVA (%)<input id=vat type=number value=21 oninput=calc()></label><label>Descuento (€)<input id=discount type=number value=0 step=.01 oninput=calc()></label></div><div id=totals class=total></div><div class=actions no-print><button class="btn primary" onclick="saveDoc('${t}')">Guardar</button><button class=btn onclick="go('${t==='P'?'Presupuestos':'Facturas'}')">Cancelar</button></div></div>`;addLine();}
function addLine(){let sv=S.get('services');let d=document.createElement('div');d.className='row';d.innerHTML=`<label>Concepto<select onchange="pickService(this)"><option value="">Escribir...</option>${sv.map((s,i)=>`<option value=${i}>${esc(s.name)}</option>`).join('')}</select><input class=desc placeholder="Descripción"></label><label>Cant.<input class=qty type=number value=1 step=.01 oninput=calc()></label><label>Precio €<input class=price type=number value=0 step=.01 oninput=calc()></label><button class=btn onclick="this.parentElement.remove();calc()">×</button>`;lines.appendChild(d);calc()}
function pickService(sel){let s=S.get('services')[+sel.value];if(s){let r=sel.closest('.row');r.querySelector('.desc').value=s.name;r.querySelector('.price').value=s.price;calc()}}
function calc(){let base=[...document.querySelectorAll('.row')].reduce((a,r)=>a+(+r.querySelector('.qty').value||0)*(+r.querySelector('.price').value||0),0);let disc=+discount.value||0, b=Math.max(0,base-disc),v=b*(+vat.value||0)/100,t=b+v;totals.innerHTML=`Base: ${b.toFixed(2)} €<br>IVA: ${v.toFixed(2)} €<br>Total: ${t.toFixed(2)} €`;return {base:b,vatAmount:v,total:t}}
function saveDoc(t){let ci=client.value;if(ci===''){alert('Selecciona un cliente.');return}let c=S.get('clients')[+ci], linesA=[...document.querySelectorAll('.row')].map(r=>({desc:r.querySelector('.desc').value,qty:+r.querySelector('.qty').value||0,price:+r.querySelector('.price').value||0})).filter(x=>x.desc);if(!linesA.length){alert('Añade al menos un concepto.');return}let sums=calc(),doc={no:nextNo(t),date:date.value,client:c,notes:notes.value,lines:linesA,vat:+vat.value||0,discount:+discount.value||0,...sums};let k=t==='P'?'budgets':'invoices',x=S.get(k);x.push(doc);S.set(k,x);viewDoc(t,x.length-1)}
function viewDoc(t,i){let d=S.get(t==='P'?'budgets':'invoices')[i];app.innerHTML=`<div class=card><div style="display:flex;justify-content:space-between;gap:15px"><img src=logo.png style="width:180px;max-width:40%;object-fit:contain"><div style="text-align:right"><b>${t==='P'?'PRESUPUESTO':'FACTURA'} ${d.no}</b><div>${d.date}</div></div></div><hr><div class=grid><div><b>${COMPANY.name}</b><div class=small>${COMPANY.owner}<br>NIF ${COMPANY.nif}<br>${COMPANY.address}<br>${COMPANY.phone} · ${COMPANY.email}</div></div><div><b>Cliente</b><div>${esc(d.client.name)}</div><div class=small>${esc(d.client.nif)}<br>${esc(d.client.address)}<br>${esc(d.client.phone)} ${esc(d.client.email)}</div></div></div><div style="margin-top:20px">${d.lines.map(l=>`<div class=item><b>${esc(l.desc)}</b><span style="float:right">${l.qty} × ${l.price.toFixed(2)} € = ${(l.qty*l.price).toFixed(2)} €</span></div>`).join('')}</div><div class=total style="margin-top:15px">Base: ${d.base.toFixed(2)} €<br>IVA (${d.vat}%): ${d.vatAmount.toFixed(2)} €<br><b>Total: ${d.total.toFixed(2)} €</b></div>${d.notes?`<p><b>Observaciones:</b><br>${esc(d.notes)}</p>`:''}<div class="actions no-print"><button class="btn primary" onclick="window.print()">Imprimir / Guardar PDF</button><button class=btn onclick="go('${t==='P'?'Presupuestos':'Facturas'}')">Volver</button></div></div>`}
function toInvoice(i){let b=S.get('budgets')[i],x=S.get('invoices');x.push({...b,no:nextNo('F'),date:new Date().toISOString().slice(0,10)});S.set('invoices',x);page='Facturas';tabs();viewDoc('F',x.length-1)}
if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});tabs();render();
</script></body></html>
