<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SERÓN GROUNDS</title><link rel="manifest" href="manifest.json"><style>
:root{--g:#49b92f;--g2:#238a2f;--dark:#173f2a;--pale:#eef9e9;--bg:#f7fbf5;--card:#fff;--mut:#5d6d5f}*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:#172018}header{background:linear-gradient(135deg,var(--dark),var(--g2));color:#fff;padding:14px 16px;display:flex;align-items:center;gap:14px;position:sticky;top:0;z-index:3}header img{width:120px;height:82px;object-fit:contain;background:#fff;border-radius:8px}header b{font-size:20px}.wrap{max-width:1050px;margin:auto;padding:16px}.tabs{display:flex;gap:8px;overflow:auto;margin-bottom:16px}.tabs button,.btn{border:0;border-radius:10px;padding:11px 14px;background:#e2e8e1;font-weight:700}.tabs button.active,.btn.primary{background:var(--g);color:#fff;box-shadow:0 3px 10px #49b92f35}.btn.primary:active{transform:translateY(1px)}.card{background:#fff;border:1px solid #e3f1df;border-radius:16px;padding:16px;margin-bottom:14px;box-shadow:0 2px 10px #0000000b}h2{margin:0 0 14px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}label{font-size:13px;font-weight:700;color:var(--mut)}input,textarea,select{width:100%;padding:12px;border:1px solid #cfe3ca;border-radius:9px;margin-top:5px;font:inherit}textarea{min-height:80px}.full{grid-column:1/-1}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.row{display:grid;grid-template-columns:2fr .6fr .8fr auto;gap:8px;align-items:end;margin:8px 0}.total{font-size:20px;font-weight:800;text-align:right}.item{padding:12px 0;border-bottom:1px solid #edf0ed}.small{font-size:13px;color:var(--mut)}.home{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.home button{min-height:100px;font-size:17px}.hidden{display:none}.calbar{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:12px}.calgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}.calhead{text-align:center;font-size:12px;font-weight:800;color:var(--mut);padding:6px 2px}.calday{min-height:92px;border:1px solid #dbead7;border-radius:10px;background:#fff;padding:6px;cursor:pointer;overflow:hidden}.calday.other{opacity:.35}.calday.today{outline:3px solid var(--g)}.calnum{font-weight:800}.calevent{display:block;margin-top:4px;padding:4px 5px;border-radius:6px;font-size:10px;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.ev-work{background:#dff4d7}.ev-visit{background:#dcecff}.ev-budget{background:#fff1c9}.ev-maint{background:#e8dcf7}.callegend{display:flex;gap:10px;flex-wrap:wrap;font-size:12px;margin-top:10px}.caldot{padding:4px 7px;border-radius:7px}@media(max-width:650px){.calday{min-height:72px;padding:4px}.calevent{font-size:9px;padding:3px}.calhead{font-size:10px}.docrow,.hrow{grid-template-columns:1fr 1fr!important}.docrow label:first-child,.hrow label:first-child{grid-column:1/-1}.docrow button,.hrow button{grid-column:1/-1}.grid{grid-template-columns:1fr}.row{grid-template-columns:1fr 70px 90px auto}.home{grid-template-columns:1fr 1fr}header b{font-size:17px}}

</style></head><body><header><img src="logo.png"><div><b>SERÓN GROUNDS</b><div style="font-size:12px">Servicios Integrales de Jardinería</div></div></header><div class="wrap"><div class="tabs no-print" id="tabs"></div><main id="app"></main></div><script>
const COMPANY={name:'SERÓN GROUNDS SERVICIOS INTEGRALES DE JARDINERÍA',owner:'Miguel Ángel Serón Rodríguez',nif:'77236704J',phone:'644 039 107',email:'Info@serongrounds.es',address:'Avenida Alcalde Antonio Solano, 29120 Alhaurín el Grande, Málaga'};
const S={get(k,d=[]){return JSON.parse(localStorage.getItem(k)||JSON.stringify(d))},set(k,v){localStorage.setItem(k,JSON.stringify(v))}};
let page='Inicio'; const pages=['Inicio','Hoy','Clientes','Jardines','Presupuestos','Facturas','Por horas','Agenda','Partes','Gastos','Servicios','Resumen','Configuración','Copias'];
const CFG=()=>S.get('settings',{iban:'',bic:'',bankOwner:'Miguel Ángel Serón Rodríguez',defaultVat:21,defaultIrpf:0,defaultHourly:30,paymentDays:30});
function tabs(){document.getElementById('tabs').innerHTML=pages.map(p=>`<button class="${p===page?'active':''}" onclick="go('${p}')">${p}</button>`).join('')}
function go(p){page=p;tabs();render()}; function esc(s=''){return String(s).replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function nextNo(type){let y=new Date().getFullYear(), key=type==='P'?'budgets':'invoices', arr=S.get(key); let nums=arr.filter(x=>x.no?.startsWith(type+'-'+y+'-')).map(x=>+x.no.split('-').pop()); return `${type}-${y}-${String((Math.max(0,...nums)+1)).padStart(3,'0')}`}
function render(){let a=document.getElementById('app'); if(page==='Inicio') a.innerHTML=`<div class=card><h2>Panel principal</h2><div class=home><button class="btn primary" onclick="newDoc('P')">＋ Nuevo presupuesto</button><button class="btn primary" onclick="newDoc('F')">＋ Nueva factura</button><button class=btn onclick="go('Hoy')">☀️ Hoy</button><button class=btn onclick="go('Clientes')">👤 Clientes</button><button class=btn onclick="go('Jardines')">🏡 Jardines</button><button class=btn onclick="go('Servicios')">🌿 Servicios</button><button class=btn onclick="go('Agenda')">📅 Agenda</button><button class=btn onclick="go('Partes')">📝 Partes</button><button class=btn onclick="go('Por horas')">⏱️ Por horas</button><button class=btn onclick="go('Gastos')">💶 Gastos</button><button class=btn onclick="go('Resumen')">📊 Resumen</button><button class=btn onclick="go('Configuración')">⚙️ Configuración</button><button class=btn onclick="go('Copias')">💾 Copias</button></div></div><div class=card><b>${COMPANY.owner}</b><div class=small>${COMPANY.nif} · ${COMPANY.phone}<br>${COMPANY.email}<br>${COMPANY.address}</div></div>`; else if(page==='Hoy') todayPage(); else if(page==='Clientes') clients(); else if(page==='Jardines') gardens(); else if(page==='Partes') workReports(); else if(page==='Por horas') hourlyJobs(); else if(page==='Configuración') settings(); else if(page==='Servicios') services(); else if(page==='Agenda') agenda(); else if(page==='Gastos') expenses(); else if(page==='Resumen') summary(); else if(page==='Copias') backups(); else listDocs(page==='Presupuestos'?'P':'F')}
function clients(){let x=S.get('clients');app.innerHTML=`<div class=card><h2>Clientes</h2><div class=grid><label>Nombre<input id=cn></label><label>NIF/CIF<input id=ci></label><label>Teléfono<input id=cp></label><label>Email<input id=ce></label><label>Dirección fiscal<input id=ca></label><label>Dirección del trabajo<input id=cwork></label><label>C.P. / Población<input id=ccity></label><label class=full>Notas<textarea id=cnotes></textarea></label></div><div class=actions><button class="btn primary" onclick="addClient()">Guardar cliente</button></div></div><div class=card>${x.length?x.map((c,i)=>`<div class=item><b>${esc(c.name)}</b><div class=small>${esc(c.nif)} · ${esc(c.phone)}<br>${esc(c.address)}</div><button class="btn no-print" onclick="whatsClient(${i})">💬 WhatsApp</button><button class="btn no-print" onclick="mapClient(${i})">📍 Ir</button><button class="btn no-print" onclick="del('clients',${i})">Eliminar</button></div>`).join(''):'Todavía no hay clientes.'}</div>`}
function mapClient(i){let c=S.get('clients')[i];if(!c.address){alert('Este cliente no tiene dirección.');return}window.open('https://maps.apple.com/?q='+encodeURIComponent(c.address),'_blank')}
function whatsClient(i){let c=S.get('clients')[i],n=String(c.phone||'').replace(/\D/g,'');if(!n){alert('Este cliente no tiene teléfono.');return}if(n.length===9)n='34'+n;let txt='Hola '+(c.name||'')+', soy Miguel de SERÓN GROUNDS.';window.open('https://wa.me/'+n+'?text='+encodeURIComponent(txt),'_blank')}
function addClient(){let x=S.get('clients');x.push({name:cn.value,nif:ci.value,phone:cp.value,email:ce.value,address:ca.value,workAddress:cwork.value,city:ccity.value,notes:cnotes.value});S.set('clients',x);clients()}function del(k,i){let x=S.get(k);x.splice(i,1);S.set(k,x);render()}
function services(){let x=S.get('services',[{name:'Mantenimiento de jardín',price:0},{name:'Poda',price:0},{name:'Desbroce',price:0},{name:'Limpieza de parcela',price:0},{name:'Instalación / reparación de riego',price:0},{name:'Plantación',price:0},{name:'Césped',price:0},{name:'Tratamientos',price:0},{name:'Mano de obra',price:0},{name:'Materiales',price:0}]);if(!localStorage.services)S.set('services',x);app.innerHTML=`<div class=card><h2>Servicios</h2><div class=grid><label>Concepto<input id=sn></label><label>Precio habitual (€)<input id=sp type=number step=.01></label></div><div class=actions><button class="btn primary" onclick="addService()">Añadir servicio</button></div></div><div class=card>${x.map((s,i)=>`<div class=item><b>${esc(s.name)}</b> <span class=small>${(+s.price).toFixed(2)} €</span><button class="btn no-print" onclick="del('services',${i})">Eliminar</button></div>`).join('')}</div>`}
function addService(){let x=S.get('services');x.push({name:sn.value,price:+sp.value||0});S.set('services',x);services()}
function listDocs(t){let k=t==='P'?'budgets':'invoices',x=S.get(k);app.innerHTML=`<div class=card><h2>${t==='P'?'Presupuestos':'Facturas'}</h2><button class="btn primary no-print" onclick="newDoc('${t}')">＋ Nuevo</button></div><div class=card>${x.length?x.slice().reverse().map((d,ri)=>{let i=x.length-1-ri;return `<div class=item><b>${d.no}</b> — ${esc(d.client.name||'Sin cliente')}<div class=small>${d.date} · ${esc(d.status||'Pendiente')} · Total: ${d.total.toFixed(2)} €${t==='F'?' · '+invoiceState(d):''}</div><div class=actions no-print><button class=btn onclick="viewDoc('${t}',${i})">Ver / imprimir</button><button class=btn onclick="shareWhatsApp('${t}',${i})">💬 WhatsApp</button>${t==='P'?`<button class=btn onclick="toInvoice(${i})">Convertir en factura</button>`:`<button class=btn onclick="togglePaid(${i})">${d.paid?'Marcar pendiente':'Marcar pagada'}</button>`}<button class=btn onclick="del('${k}',${i})">Eliminar</button></div></div>`}).join(''):'Todavía no hay documentos.'}</div>`}
function plusDays(d,n){let x=new Date(d+'T12:00:00');x.setDate(x.getDate()+n);return x.toISOString().slice(0,10)}
function newDoc(t){let clients=S.get('clients'),cfg=CFG(),today=new Date().toISOString().slice(0,10);app.innerHTML=`<div class=card><h2>Nuevo ${t==='P'?'presupuesto':'factura'} · ${nextNo(t)}</h2><div class=grid><label>Fecha de emisión<input id=date type=date value="${today}"></label>${t==='F'?`<label>Fecha límite de pago<input id=due type=date value="${plusDays(today,cfg.paymentDays||30)}"></label>`:''}<label>Cliente<select id=client><option value="">Seleccionar...</option>${clients.map((c,i)=>`<option value=${i}>${esc(c.name)}</option>`).join('')}</select></label><label>Estado<select id=status>${t==='P'?'<option>Pendiente</option><option>Aceptado</option><option>Rechazado</option>':'<option>Pendiente</option><option>Pagada</option>'}</select></label><label>Forma de pago<select id=payment><option>Transferencia</option><option>Efectivo</option><option>Tarjeta</option><option>Domiciliación</option><option>Otro</option></select></label><label class=full>Observaciones<textarea id=notes></textarea></label></div></div><div class=card><h2>Conceptos</h2><div class=small>Descripción · Cantidad · Precio · Descuento % · IVA % · IRPF % · Importe</div><div id=lines></div><button class="btn no-print" onclick="addLine()">＋ Añadir línea</button><div id=totals class=total style="margin-top:15px"></div><div class="actions no-print"><button class="btn primary" onclick="saveDoc('${t}')">Guardar</button><button class=btn onclick="go('${t==='P'?'Presupuestos':'Facturas'}')">Cancelar</button></div></div>`;addLine()}
function addLine(pref={}){let sv=S.get('services'),cfg=CFG(),d=document.createElement('div');d.className='docrow';d.style.cssText='display:grid;grid-template-columns:2fr .6fr .8fr .7fr .6fr .6fr .9fr auto;gap:6px;align-items:end;margin:10px 0';d.innerHTML=`<label>Descripción<select onchange="pickService(this)"><option value="">Escribir...</option>${sv.map((s,i)=>`<option value=${i}>${esc(s.name)}</option>`).join('')}</select><input class=desc value="${esc(pref.desc||'')}" placeholder="Descripción"></label><label>Cant.<input class=qty type=number value="${pref.qty??1}" step=.01 oninput=calc()></label><label>Precio €<input class=price type=number value="${pref.price??0}" step=.01 oninput=calc()></label><label>Dto. %<input class=ldisc type=number value="${pref.discount??0}" step=.01 oninput=calc()></label><label>IVA %<input class=lvat type=number value="${pref.vat??cfg.defaultVat??21}" step=.01 oninput=calc()></label><label>IRPF %<input class=lirpf type=number value="${pref.irpf??cfg.defaultIrpf??0}" step=.01 oninput=calc()></label><label>Importe<input class=lamount readonly></label><button class=btn onclick="this.parentElement.remove();calc()">×</button>`;lines.appendChild(d);calc()}
function pickService(sel){let s=S.get('services')[+sel.value];if(s){let r=sel.closest('.docrow');r.querySelector('.desc').value=s.name;r.querySelector('.price').value=s.price;calc()}}
function calc(){let base=0,vatAmount=0,irpfAmount=0,discountAmount=0;document.querySelectorAll('.docrow').forEach(r=>{let q=+r.querySelector('.qty').value||0,p=+r.querySelector('.price').value||0,dp=+r.querySelector('.ldisc').value||0,vp=+r.querySelector('.lvat').value||0,ip=+r.querySelector('.lirpf').value||0,g=q*p,disc=g*dp/100,b=g-disc,v=b*vp/100,ir=b*ip/100,total=b+v-ir;base+=b;discountAmount+=disc;vatAmount+=v;irpfAmount+=ir;r.querySelector('.lamount').value=total.toFixed(2)+' €'});let total=base+vatAmount-irpfAmount;totals.innerHTML=`Base imponible: ${base.toFixed(2)} €<br>Descuentos: ${discountAmount.toFixed(2)} €<br>IVA: ${vatAmount.toFixed(2)} €<br>IRPF: -${irpfAmount.toFixed(2)} €<br><b>Total: ${total.toFixed(2)} €</b>`;return {base,discountAmount,vatAmount,irpfAmount,total}}
function saveDoc(t){let ci=client.value;if(ci===''){alert('Selecciona un cliente.');return}let c=S.get('clients')[+ci],linesA=[...document.querySelectorAll('.docrow')].map(r=>({desc:r.querySelector('.desc').value,qty:+r.querySelector('.qty').value||0,price:+r.querySelector('.price').value||0,discount:+r.querySelector('.ldisc').value||0,vat:+r.querySelector('.lvat').value||0,irpf:+r.querySelector('.lirpf').value||0})).filter(x=>x.desc);if(!linesA.length){alert('Añade al menos un concepto.');return}let sums=calc(),doc={no:nextNo(t),date:date.value,due:t==='F'?due.value:'',client:c,notes:notes.value,lines:linesA,status:status.value,payment:payment.value,paid:t==='F'&&status.value==='Pagada',...sums};let k=t==='P'?'budgets':'invoices',x=S.get(k);x.push(doc);S.set(k,x);viewDoc(t,x.length-1)}
function invoiceState(d){if(d.paid||d.status==='Pagada')return 'Pagada';if(d.due&&d.due<new Date().toISOString().slice(0,10))return 'Vencida';return d.status||'Pendiente'}
function viewDoc(t,i){let d=S.get(t==='P'?'budgets':'invoices')[i],cfg=CFG(),lines=d.lines||[];app.innerHTML=`<div class=card><div style="display:flex;justify-content:space-between;gap:15px"><img src=logo.png style="width:220px;max-width:45%;object-fit:contain"><div style="text-align:right"><b>${t==='P'?'PRESUPUESTO':'FACTURA'} ${d.no}</b><div>Emisión: ${d.date}</div>${t==='F'&&d.due?`<div>Vencimiento: ${d.due}</div><div><b>${invoiceState(d)}</b></div>`:''}</div></div><hr><div class=grid><div><b>${COMPANY.name}</b><div class=small>${COMPANY.owner}<br>NIF ${COMPANY.nif}<br>${COMPANY.address}<br>${COMPANY.phone} · ${COMPANY.email}</div></div><div><b>Cliente</b><div>${esc(d.client.name)}</div><div class=small>${esc(d.client.nif)}<br>${esc(d.client.address)} ${esc(d.client.city||'')}<br>${esc(d.client.phone)} · ${esc(d.client.email)}${d.client.workAddress?'<br>Trabajo: '+esc(d.client.workAddress):''}</div></div></div><div style="margin-top:20px;overflow:auto"><table style="width:100%;border-collapse:collapse"><tr><th align=left>Descripción</th><th>Cant.</th><th>Precio</th><th>Dto.</th><th>IVA</th><th>IRPF</th><th>Importe</th></tr>${lines.map(l=>{let b=(l.qty*l.price)*(1-(l.discount||0)/100),amt=b*(1+(l.vat??d.vat??21)/100-(l.irpf||0)/100);return `<tr><td>${esc(l.desc)}</td><td align=center>${l.qty}</td><td align=right>${(+l.price).toFixed(2)} €</td><td align=center>${l.discount||0}%</td><td align=center>${l.vat??d.vat??21}%</td><td align=center>${l.irpf||0}%</td><td align=right>${amt.toFixed(2)} €</td></tr>`}).join('')}</table></div><div class=total style="margin-top:15px">Base: ${(+d.base||0).toFixed(2)} €<br>IVA: ${(+d.vatAmount||0).toFixed(2)} €<br>IRPF: -${(+d.irpfAmount||0).toFixed(2)} €<br><b>Total: ${(+d.total||0).toFixed(2)} €</b></div><p><b>Forma de pago:</b> ${esc(d.payment||'Transferencia')}</p>${(d.payment||'Transferencia')==='Transferencia'&&cfg.iban?`<p><b>Cuenta bancaria:</b><br>Titular: ${esc(cfg.bankOwner||COMPANY.owner)}<br>IBAN: ${esc(cfg.iban)}${cfg.bic?'<br>BIC/SWIFT: '+esc(cfg.bic):''}<br>Concepto: ${d.no}</p>`:''}${d.notes?`<p><b>Observaciones:</b><br>${esc(d.notes)}</p>`:''}${d.signature?`<p><b>Firma:</b><br><img src="${d.signature}" style="max-width:260px"></p>`:''}<div class="actions no-print"><button class="btn primary" onclick="window.print()">Imprimir / Guardar PDF</button><button class=btn onclick="signDoc('${t}',${i})">✍️ Firma</button><button class=btn onclick="shareWhatsApp('${t}',${i})">💬 WhatsApp</button><button class=btn onclick="go('${t==='P'?'Presupuestos':'Facturas'}')">Volver</button></div></div>`}
function toInvoice(i){let b=S.get('budgets')[i],x=S.get('invoices'),cfg=CFG(),today=new Date().toISOString().slice(0,10);x.push({...b,no:nextNo('F'),date:today,due:plusDays(today,cfg.paymentDays||30),status:'Pendiente',paid:false});S.set('invoices',x);page='Facturas';tabs();viewDoc('F',x.length-1)}
function togglePaid(i){let x=S.get('invoices');x[i].paid=!x[i].paid;x[i].status=x[i].paid?'Pagada':'Pendiente';S.set('invoices',x);listDocs('F')}
function shareWhatsApp(t,i){let d=S.get(t==='P'?'budgets':'invoices')[i],txt=`SERÓN GROUNDS\n${t==='P'?'Presupuesto':'Factura'} ${d.no}\nCliente: ${d.client.name}\nTotal: ${d.total.toFixed(2)} €\nEstado: ${d.status||'Pendiente'}`;window.open('https://wa.me/?text='+encodeURIComponent(txt),'_blank')}
function signDoc(t,i){let k=t==='P'?'budgets':'invoices';app.innerHTML=`<div class=card><h2>Firma del cliente</h2><p>Firma dentro del recuadro.</p><canvas id=sig width=700 height=300 style="width:100%;height:220px;border:2px solid #ccd4cc;border-radius:12px;background:white;touch-action:none"></canvas><div class=actions><button class="btn primary" onclick="saveSig('${t}',${i})">Guardar firma</button><button class=btn onclick="viewDoc('${t}',${i})">Cancelar</button></div></div>`;let c=sig,ctx=c.getContext('2d'),on=false,last;function pos(e){let r=c.getBoundingClientRect(),q=e.touches?e.touches[0]:e;return [(q.clientX-r.left)*c.width/r.width,(q.clientY-r.top)*c.height/r.height]}function st(e){e.preventDefault();on=true;last=pos(e)}function mv(e){if(!on)return;e.preventDefault();let p=pos(e);ctx.lineWidth=4;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(...last);ctx.lineTo(...p);ctx.stroke();last=p}function en(){on=false}c.onmousedown=st;c.onmousemove=mv;c.onmouseup=en;c.onmouseleave=en;c.ontouchstart=st;c.ontouchmove=mv;c.ontouchend=en}
function saveSig(t,i){let k=t==='P'?'budgets':'invoices',x=S.get(k);x[i].signature=sig.toDataURL('image/png');S.set(k,x);viewDoc(t,i)}
let agendaMonth=new Date().getMonth(),agendaYear=new Date().getFullYear(),agendaSelected='';
function agendaClass(t=''){t=t.toLowerCase();if(t.includes('presupuesto'))return 'ev-budget';if(t.includes('visita')||t.includes('cita'))return 'ev-visit';if(t.includes('mantenimiento'))return 'ev-maint';return 'ev-work'}

function money(n){return (+n||0).toFixed(2)+' €'}
function paymentsOf(d){return Array.isArray(d.payments)?d.payments:[]}
function paidAmount(d){if(d.paid&&!paymentsOf(d).length)return +d.total||0;return Math.min(+d.total||0,paymentsOf(d).reduce((a,p)=>a+(+p.amount||0),0))}
function pendingAmount(d){return Math.max(0,(+d.total||0)-paidAmount(d))}
function invoiceState(d){let paid=paidAmount(d),total=+d.total||0;if(total>0&&paid>=total-.005)return 'Pagada';if(paid>0)return 'Parcialmente pagada';if(d.due&&d.due<new Date().toISOString().slice(0,10))return 'Vencida';return 'Pendiente'}
function addPayment(i){let x=S.get('invoices'),d=x[i],pending=pendingAmount(d);if(pending<=0){alert('Esta factura ya está pagada.');return}let mode=prompt('Escribe % para porcentaje o € para importe. Ejemplo: 65% o 350€','65%');if(!mode)return;let amount=0,m=mode.replace(',','.').trim();if(m.includes('%'))amount=(+m.replace('%','')||0)/100*(+d.total||0);else amount=+m.replace('€','').trim()||0;if(amount<=0){alert('Importe no válido.');return}amount=Math.min(amount,pending);let method=prompt('Forma de pago: Transferencia, Efectivo, Tarjeta, Domiciliación u Otro',d.payment||'Transferencia')||d.payment||'Transferencia';d.payments=paymentsOf(d);d.payments.push({date:new Date().toISOString().slice(0,10),amount,method});d.paid=pendingAmount(d)<=.005;d.status=invoiceState(d);S.set('invoices',x);viewDoc('F',i)}
function paymentBlock(d,i){let paid=paidAmount(d),pending=pendingAmount(d),pct=d.total?paid/d.total*100:0;return `<div style="margin-top:18px;background:var(--pale);border:1px solid #cfe9c7;border-radius:14px;padding:14px"><b>COBROS</b><div style="display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px;text-align:center"><div><small>Total</small><br><b>${money(d.total)}</b></div><div><small>Pagado</small><br><b>${money(paid)} (${pct.toFixed(1)}%)</b></div><div><small>Pendiente</small><br><b>${money(pending)}</b></div></div>${paymentsOf(d).map(p=>`<div class=small style="margin-top:7px">${p.date} · ${esc(p.method)} · ${money(p.amount)}</div>`).join('')}<div class="actions no-print"><button class="btn primary" onclick="addPayment(${i})">＋ Registrar cobro</button></div></div>`}
function viewDoc(t,i){let d=S.get(t==='P'?'budgets':'invoices')[i],cfg=CFG(),lines=d.lines||[];app.innerHTML=`<div class=card><div style="display:flex;justify-content:space-between;gap:15px;border-bottom:5px solid var(--g);padding-bottom:12px"><img src=logo.png style="width:230px;max-width:45%;object-fit:contain"><div style="text-align:right"><b style="font-size:20px">${t==='P'?'PRESUPUESTO':'FACTURA'} ${d.no}</b><div>Emisión: ${d.date}</div>${t==='F'&&d.due?`<div>Vencimiento: ${d.due}</div><div><b>${invoiceState(d)}</b></div>`:''}</div></div><div class=grid style="margin-top:18px"><div><b>${COMPANY.name}</b><div class=small>${COMPANY.owner}<br>NIF ${COMPANY.nif}<br>${COMPANY.address}<br>${COMPANY.phone} · ${COMPANY.email}</div></div><div style="background:var(--pale);padding:12px;border-radius:12px"><b>Cliente</b><div>${esc(d.client.name)}</div><div class=small>${esc(d.client.nif)}<br>${esc(d.client.address)} ${esc(d.client.city||'')}<br>${esc(d.client.phone)} · ${esc(d.client.email)}${d.client.workAddress?'<br>Trabajo: '+esc(d.client.workAddress):''}</div></div></div><div style="margin-top:20px;overflow:auto"><table style="width:100%;border-collapse:collapse"><tr style="background:var(--g);color:white"><th align=left style="padding:9px">Descripción</th><th>Cant.</th><th>Precio</th><th>Dto.</th><th>IVA</th><th>IRPF</th><th>Importe</th></tr>${lines.map((l,j)=>{let b=(l.qty*l.price)*(1-(l.discount||0)/100),amt=b*(1+(l.vat??d.vat??21)/100-(l.irpf||0)/100);return `<tr style="background:${j%2?'white':'var(--pale)'}"><td style="padding:9px">${esc(l.desc)}</td><td align=center>${l.qty}</td><td align=right>${money(l.price)}</td><td align=center>${l.discount||0}%</td><td align=center>${l.vat??d.vat??21}%</td><td align=center>${l.irpf||0}%</td><td align=right>${money(amt)}</td></tr>`}).join('')}</table></div><div class=total style="margin-top:15px">Base: ${money(d.base)}<br>IVA: ${money(d.vatAmount)}<br>IRPF: -${money(d.irpfAmount)}<br><b>Total: ${money(d.total)}</b></div>${t==='F'?paymentBlock(d,i):''}<p><b>Forma de pago:</b> ${esc(d.payment||'Transferencia')}</p>${(d.payment||'Transferencia')==='Transferencia'&&cfg.iban?`<p style="background:var(--pale);padding:12px;border-radius:12px"><b>Información de pago</b><br>Titular: ${esc(cfg.bankOwner||COMPANY.owner)}<br>IBAN: ${esc(cfg.iban)}${cfg.bic?'<br>BIC/SWIFT: '+esc(cfg.bic):''}<br>Referencia: ${d.no}</p>`:''}${d.notes?`<p><b>Observaciones:</b><br>${esc(d.notes)}</p>`:''}${d.signature?`<p><b>Firma:</b><br><img src="${d.signature}" style="max-width:260px"></p>`:''}<div class="actions no-print"><button class="btn primary" onclick="window.print()">Imprimir / Guardar PDF</button><button class=btn onclick="signDoc('${t}',${i})">✍️ Firma</button><button class=btn onclick="shareWhatsApp('${t}',${i})">💬 WhatsApp</button>${t==='F'?`<button class=btn onclick="addPayment(${i})">💶 Registrar cobro</button>`:''}<button class=btn onclick="go('${t==='P'?'Presupuestos':'Facturas'}')">Volver</button></div></div>`}
function listDocs(t){let k=t==='P'?'budgets':'invoices',x=S.get(k);app.innerHTML=`<div class=card><h2>${t==='P'?'Presupuestos':'Facturas'}</h2><button class="btn primary no-print" onclick="newDoc('${t}')">＋ Nuevo</button></div><div class=card>${x.length?x.slice().reverse().map((d,ri)=>{let i=x.length-1-ri;return `<div class=item><b>${d.no}</b> — ${esc(d.client.name||'Sin cliente')}<div class=small>${d.date} · ${esc(d.status||'Pendiente')} · Total: ${money(d.total)}${t==='F'?` · <b>${invoiceState(d)}</b> · Pendiente: ${money(pendingAmount(d))}`:''}</div><div class=actions no-print><button class=btn onclick="viewDoc('${t}',${i})">Ver / imprimir</button><button class=btn onclick="shareWhatsApp('${t}',${i})">💬 WhatsApp</button>${t==='P'?`<button class=btn onclick="toInvoice(${i})">Convertir en factura</button>`:`<button class="btn primary" onclick="addPayment(${i})">💶 Cobro</button>`}<button class=btn onclick="del('${k}',${i})">Eliminar</button></div></div>`}).join(''):'Todavía no hay documentos.'}</div>`}
function summary(){let inv=S.get('invoices'),bud=S.get('budgets'),ex=S.get('expenses'),income=inv.reduce((a,d)=>a+paidAmount(d),0),pending=inv.reduce((a,d)=>a+pendingAmount(d),0),cost=ex.reduce((a,e)=>a+(+e.amount||0),0),billed=inv.reduce((a,d)=>a+(+d.total||0),0),over=inv.filter(d=>invoiceState(d)==='Vencida').reduce((a,d)=>a+pendingAmount(d),0);app.innerHTML=`<div class=card><h2>Resumen</h2><div class=home><div class=card><b>Facturado</b><div class=total>${money(billed)}</div></div><div class=card><b>Cobrado</b><div class=total>${money(income)}</div></div><div class=card><b>Pendiente</b><div class=total>${money(pending)}</div></div><div class=card><b>Vencido</b><div class=total>${money(over)}</div></div><div class=card><b>Gastos</b><div class=total>${money(cost)}</div></div><div class=card><b>Resultado simple</b><div class=total>${money(income-cost)}</div></div></div><div class=small>${bud.length} presupuestos · ${inv.length} facturas · ${S.get('clients').length} clientes · ${S.get('agenda').length} trabajos en agenda</div></div>`}
function todayPage(){let today=new Date().toISOString().slice(0,10),ag=S.get('agenda').filter(e=>e.date===today),inv=S.get('invoices').filter(d=>invoiceState(d)==='Vencida');app.innerHTML=`<div class=card><h2>☀️ Hoy · ${today}</h2><h3>Trabajos de hoy</h3>${ag.length?ag.map(e=>`<div class=item><b>${esc(e.time||'')} ${esc(e.client)}</b><div>${esc(e.type||'')} · ${esc(e.notes||'')}</div></div>`).join(''):'<p class=small>No hay trabajos programados para hoy.</p>'}<h3>Cobros vencidos</h3>${inv.length?inv.map(d=>`<div class=item><b>${d.no} · ${esc(d.client.name)}</b><div class=small>Pendiente ${money(pendingAmount(d))} · venció ${d.due}</div><button class=btn onclick="shareWhatsApp('F',${S.get('invoices').indexOf(d)})">💬 Recordar por WhatsApp</button></div>`).join(''):'<p class=small>No hay facturas vencidas.</p>'}</div>`}

if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});tabs();render();
</script></body></html>
