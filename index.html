<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SERÓN GROUNDS</title><link rel="manifest" href="manifest.json"><style>
:root{--g:#173f2a;--g2:#2f6b43;--bg:#f4f6f2;--card:#fff;--mut:#657067}*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:#172018}header{background:var(--g);color:#fff;padding:14px 16px;display:flex;align-items:center;gap:14px;position:sticky;top:0;z-index:3}header img{width:120px;height:82px;object-fit:contain;background:#fff;border-radius:8px}header b{font-size:20px}.wrap{max-width:1050px;margin:auto;padding:16px}.tabs{display:flex;gap:8px;overflow:auto;margin-bottom:16px}.tabs button,.btn{border:0;border-radius:10px;padding:11px 14px;background:#e2e8e1;font-weight:700}.tabs button.active,.btn.primary{background:var(--g);color:#fff}.card{background:#fff;border-radius:14px;padding:16px;margin-bottom:14px;box-shadow:0 2px 10px #0000000b}h2{margin:0 0 14px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}label{font-size:13px;font-weight:700;color:var(--mut)}input,textarea,select{width:100%;padding:11px;border:1px solid #ccd4cc;border-radius:9px;margin-top:5px;font:inherit}textarea{min-height:80px}.full{grid-column:1/-1}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.row{display:grid;grid-template-columns:2fr .6fr .8fr auto;gap:8px;align-items:end;margin:8px 0}.total{font-size:20px;font-weight:800;text-align:right}.item{padding:12px 0;border-bottom:1px solid #edf0ed}.small{font-size:13px;color:var(--mut)}.home{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.home button{min-height:100px;font-size:17px}.hidden{display:none}@media(max-width:650px){.grid{grid-template-columns:1fr}.row{grid-template-columns:1fr 70px 90px auto}.home{grid-template-columns:1fr 1fr}header b{font-size:17px}}

</style></head><body><header><img src="logo.png"><div><b>SERÓN GROUNDS</b><div style="font-size:12px">Servicios Integrales de Jardinería</div></div></header><div class="wrap"><div class="tabs no-print" id="tabs"></div><main id="app"></main></div><script>
const COMPANY={name:'SERÓN GROUNDS SERVICIOS INTEGRALES DE JARDINERÍA',owner:'Miguel Ángel Serón Rodríguez',nif:'77236704J',phone:'644 039 107',email:'Info@serongrounds.es',address:'Avenida Alcalde Antonio Solano, 29120 Alhaurín el Grande, Málaga'};
const S={get(k,d=[]){return JSON.parse(localStorage.getItem(k)||JSON.stringify(d))},set(k,v){localStorage.setItem(k,JSON.stringify(v))}};
let page='Inicio'; const pages=['Inicio','Clientes','Jardines','Presupuestos','Facturas','Agenda','Partes','Gastos','Servicios','Resumen','Copias'];
function tabs(){document.getElementById('tabs').innerHTML=pages.map(p=>`<button class="${p===page?'active':''}" onclick="go('${p}')">${p}</button>`).join('')}
function go(p){page=p;tabs();render()}; function esc(s=''){return String(s).replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function nextNo(type){let y=new Date().getFullYear(), key=type==='P'?'budgets':'invoices', arr=S.get(key); let nums=arr.filter(x=>x.no?.startsWith(type+'-'+y+'-')).map(x=>+x.no.split('-').pop()); return `${type}-${y}-${String((Math.max(0,...nums)+1)).padStart(3,'0')}`}
function render(){let a=document.getElementById('app'); if(page==='Inicio') a.innerHTML=`<div class=card><h2>Panel principal</h2><div class=home><button class="btn primary" onclick="newDoc('P')">＋ Nuevo presupuesto</button><button class="btn primary" onclick="newDoc('F')">＋ Nueva factura</button><button class=btn onclick="go('Clientes')">👤 Clientes</button><button class=btn onclick="go('Jardines')">🏡 Jardines</button><button class=btn onclick="go('Servicios')">🌿 Servicios</button><button class=btn onclick="go('Agenda')">📅 Agenda</button><button class=btn onclick="go('Partes')">📝 Partes</button><button class=btn onclick="go('Gastos')">💶 Gastos</button><button class=btn onclick="go('Resumen')">📊 Resumen</button><button class=btn onclick="go('Copias')">💾 Copias</button></div></div><div class=card><b>${COMPANY.owner}</b><div class=small>${COMPANY.nif} · ${COMPANY.phone}<br>${COMPANY.email}<br>${COMPANY.address}</div></div>`; else if(page==='Clientes') clients(); else if(page==='Jardines') gardens(); else if(page==='Partes') workReports(); else if(page==='Servicios') services(); else if(page==='Agenda') agenda(); else if(page==='Gastos') expenses(); else if(page==='Resumen') summary(); else if(page==='Copias') backups(); else listDocs(page==='Presupuestos'?'P':'F')}
function clients(){let x=S.get('clients');app.innerHTML=`<div class=card><h2>Clientes</h2><div class=grid><label>Nombre<input id=cn></label><label>NIF/CIF<input id=ci></label><label>Teléfono<input id=cp></label><label>Email<input id=ce></label><label class=full>Dirección<input id=ca></label></div><div class=actions><button class="btn primary" onclick="addClient()">Guardar cliente</button></div></div><div class=card>${x.length?x.map((c,i)=>`<div class=item><b>${esc(c.name)}</b><div class=small>${esc(c.nif)} · ${esc(c.phone)}<br>${esc(c.address)}</div><button class="btn no-print" onclick="whatsClient(${i})">💬 WhatsApp</button><button class="btn no-print" onclick="mapClient(${i})">📍 Ir</button><button class="btn no-print" onclick="del('clients',${i})">Eliminar</button></div>`).join(''):'Todavía no hay clientes.'}</div>`}
function mapClient(i){let c=S.get('clients')[i];if(!c.address){alert('Este cliente no tiene dirección.');return}window.open('https://maps.apple.com/?q='+encodeURIComponent(c.address),'_blank')}
function whatsClient(i){let c=S.get('clients')[i],n=String(c.phone||'').replace(/\D/g,'');if(!n){alert('Este cliente no tiene teléfono.');return}if(n.length===9)n='34'+n;let txt='Hola '+(c.name||'')+', soy Miguel de SERÓN GROUNDS.';window.open('https://wa.me/'+n+'?text='+encodeURIComponent(txt),'_blank')}
function addClient(){let x=S.get('clients');x.push({name:cn.value,nif:ci.value,phone:cp.value,email:ce.value,address:ca.value});S.set('clients',x);clients()}function del(k,i){let x=S.get(k);x.splice(i,1);S.set(k,x);render()}
function services(){let x=S.get('services',[{name:'Mantenimiento de jardín',price:0},{name:'Poda',price:0},{name:'Desbroce',price:0},{name:'Limpieza de parcela',price:0},{name:'Instalación / reparación de riego',price:0},{name:'Plantación',price:0},{name:'Césped',price:0},{name:'Tratamientos',price:0},{name:'Mano de obra',price:0},{name:'Materiales',price:0}]);if(!localStorage.services)S.set('services',x);app.innerHTML=`<div class=card><h2>Servicios</h2><div class=grid><label>Concepto<input id=sn></label><label>Precio habitual (€)<input id=sp type=number step=.01></label></div><div class=actions><button class="btn primary" onclick="addService()">Añadir servicio</button></div></div><div class=card>${x.map((s,i)=>`<div class=item><b>${esc(s.name)}</b> <span class=small>${(+s.price).toFixed(2)} €</span><button class="btn no-print" onclick="del('services',${i})">Eliminar</button></div>`).join('')}</div>`}
function addService(){let x=S.get('services');x.push({name:sn.value,price:+sp.value||0});S.set('services',x);services()}
function listDocs(t){let k=t==='P'?'budgets':'invoices',x=S.get(k);app.innerHTML=`<div class=card><h2>${t==='P'?'Presupuestos':'Facturas'}</h2><button class="btn primary no-print" onclick="newDoc('${t}')">＋ Nuevo</button></div><div class=card>${x.length?x.slice().reverse().map((d,ri)=>{let i=x.length-1-ri;return `<div class=item><b>${d.no}</b> — ${esc(d.client.name||'Sin cliente')}<div class=small>${d.date} · ${esc(d.status||'Pendiente')} · Total: ${d.total.toFixed(2)} €${t==='F'?' · '+(d.paid?'Pagada':'Pendiente de pago'):''}</div><div class=actions no-print><button class=btn onclick="viewDoc('${t}',${i})">Ver / imprimir</button><button class=btn onclick="shareWhatsApp('${t}',${i})">💬 WhatsApp</button>${t==='P'?`<button class=btn onclick="toInvoice(${i})">Convertir en factura</button>`:`<button class=btn onclick="togglePaid(${i})">${d.paid?'Marcar pendiente':'Marcar pagada'}</button>`}<button class=btn onclick="del('${k}',${i})">Eliminar</button></div></div>`}).join(''):'Todavía no hay documentos.'}</div>`}
function newDoc(t){let clients=S.get('clients'),sv=S.get('services');app.innerHTML=`<div class=card><h2>Nuevo ${t==='P'?'presupuesto':'factura'} · ${nextNo(t)}</h2><div class=grid><label>Fecha<input id=date type=date value="${new Date().toISOString().slice(0,10)}"></label><label>Cliente<select id=client><option value="">Seleccionar...</option>${clients.map((c,i)=>`<option value=${i}>${esc(c.name)}</option>`).join('')}</select></label><label>Estado<select id=status><option>Pendiente</option><option>Aceptado</option><option>Rechazado</option><option>Finalizado</option></select></label><label>Forma de pago<select id=payment><option>Transferencia</option><option>Efectivo</option><option>Tarjeta</option><option>Domiciliación</option><option>Otro</option></select></label><label class=full>Observaciones<textarea id=notes></textarea></label></div></div><div class=card><h2>Conceptos</h2><div id=lines></div><button class="btn no-print" onclick="addLine()">＋ Añadir línea</button><div class=grid style="margin-top:15px"><label>IVA (%)<input id=vat type=number value=21 oninput=calc()></label><label>Descuento (€)<input id=discount type=number value=0 step=.01 oninput=calc()></label></div><div id=totals class=total></div><div class=actions no-print><button class="btn primary" onclick="saveDoc('${t}')">Guardar</button><button class=btn onclick="go('${t==='P'?'Presupuestos':'Facturas'}')">Cancelar</button></div></div>`;addLine();}
function addLine(){let sv=S.get('services');let d=document.createElement('div');d.className='row';d.innerHTML=`<label>Concepto<select onchange="pickService(this)"><option value="">Escribir...</option>${sv.map((s,i)=>`<option value=${i}>${esc(s.name)}</option>`).join('')}</select><input class=desc placeholder="Descripción"></label><label>Cant.<input class=qty type=number value=1 step=.01 oninput=calc()></label><label>Precio €<input class=price type=number value=0 step=.01 oninput=calc()></label><button class=btn onclick="this.parentElement.remove();calc()">×</button>`;lines.appendChild(d);calc()}
function pickService(sel){let s=S.get('services')[+sel.value];if(s){let r=sel.closest('.row');r.querySelector('.desc').value=s.name;r.querySelector('.price').value=s.price;calc()}}
function calc(){let base=[...document.querySelectorAll('.row')].reduce((a,r)=>a+(+r.querySelector('.qty').value||0)*(+r.querySelector('.price').value||0),0);let disc=+discount.value||0, b=Math.max(0,base-disc),v=b*(+vat.value||0)/100,t=b+v;totals.innerHTML=`Base: ${b.toFixed(2)} €<br>IVA: ${v.toFixed(2)} €<br>Total: ${t.toFixed(2)} €`;return {base:b,vatAmount:v,total:t}}
function saveDoc(t){let ci=client.value;if(ci===''){alert('Selecciona un cliente.');return}let c=S.get('clients')[+ci], linesA=[...document.querySelectorAll('.row')].map(r=>({desc:r.querySelector('.desc').value,qty:+r.querySelector('.qty').value||0,price:+r.querySelector('.price').value||0})).filter(x=>x.desc);if(!linesA.length){alert('Añade al menos un concepto.');return}let sums=calc(),doc={no:nextNo(t),date:date.value,client:c,notes:notes.value,status:status.value,payment:payment.value,paid:false,signature:'',lines:linesA,vat:+vat.value||0,discount:+discount.value||0,...sums};let k=t==='P'?'budgets':'invoices',x=S.get(k);x.push(doc);S.set(k,x);viewDoc(t,x.length-1)}
function viewDoc(t,i){let d=S.get(t==='P'?'budgets':'invoices')[i];app.innerHTML=`<div class=card><div style="display:flex;justify-content:space-between;gap:15px"><img src=logo.png style="width:180px;max-width:40%;object-fit:contain"><div style="text-align:right"><b>${t==='P'?'PRESUPUESTO':'FACTURA'} ${d.no}</b><div>${d.date}</div></div></div><hr><div class=grid><div><b>${COMPANY.name}</b><div class=small>${COMPANY.owner}<br>NIF ${COMPANY.nif}<br>${COMPANY.address}<br>${COMPANY.phone} · ${COMPANY.email}</div></div><div><b>Cliente</b><div>${esc(d.client.name)}</div><div class=small>${esc(d.client.nif)}<br>${esc(d.client.address)}<br>${esc(d.client.phone)} ${esc(d.client.email)}</div></div></div><div style="margin-top:20px">${d.lines.map(l=>`<div class=item><b>${esc(l.desc)}</b><span style="float:right">${l.qty} × ${l.price.toFixed(2)} € = ${(l.qty*l.price).toFixed(2)} €</span></div>`).join('')}</div><div class=total style="margin-top:15px">Base: ${d.base.toFixed(2)} €<br>IVA (${d.vat}%): ${d.vatAmount.toFixed(2)} €<br><b>Total: ${d.total.toFixed(2)} €</b></div><p><b>Estado:</b> ${esc(d.status||'Pendiente')} · <b>Pago:</b> ${esc(d.payment||'Transferencia')}${t==='F'?' · '+(d.paid?'PAGADA':'PENDIENTE'):''}</p>${d.notes?`<p><b>Observaciones:</b><br>${esc(d.notes)}</p>`:''}${d.signature?`<p><b>Firma del cliente:</b><br><img src="${d.signature}" style="max-width:260px;border-bottom:1px solid #777"></p>`:''}<div class="actions no-print"><button class="btn primary" onclick="window.print()">Imprimir / Guardar PDF</button><button class=btn onclick="shareWhatsApp('${t}',${i})">WhatsApp</button><button class=btn onclick="signDoc('${t}',${i})">Firma cliente</button><button class=btn onclick="go('${t==='P'?'Presupuestos':'Facturas'}')">Volver</button></div></div>`}
function toInvoice(i){let b=S.get('budgets')[i],x=S.get('invoices');x.push({...b,no:nextNo('F'),date:new Date().toISOString().slice(0,10),status:'Pendiente',paid:false});S.set('invoices',x);page='Facturas';tabs();viewDoc('F',x.length-1)}

function togglePaid(i){let x=S.get('invoices');x[i].paid=!x[i].paid;S.set('invoices',x);listDocs('F')}
function shareWhatsApp(t,i){let d=S.get(t==='P'?'budgets':'invoices')[i],txt=`SERÓN GROUNDS\n${t==='P'?'Presupuesto':'Factura'} ${d.no}\nCliente: ${d.client.name}\nTotal: ${d.total.toFixed(2)} €\nEstado: ${d.status||'Pendiente'}`;window.open('https://wa.me/?text='+encodeURIComponent(txt),'_blank')}
function signDoc(t,i){let k=t==='P'?'budgets':'invoices';app.innerHTML=`<div class=card><h2>Firma del cliente</h2><p>Firma dentro del recuadro.</p><canvas id=sig width=700 height=300 style="width:100%;height:220px;border:2px solid #ccd4cc;border-radius:12px;background:white;touch-action:none"></canvas><div class=actions><button class="btn primary" onclick="saveSig('${t}',${i})">Guardar firma</button><button class=btn onclick="viewDoc('${t}',${i})">Cancelar</button></div></div>`;let c=sig,ctx=c.getContext('2d'),on=false,last;function pos(e){let r=c.getBoundingClientRect(),q=e.touches?e.touches[0]:e;return [(q.clientX-r.left)*c.width/r.width,(q.clientY-r.top)*c.height/r.height]}function st(e){e.preventDefault();on=true;last=pos(e)}function mv(e){if(!on)return;e.preventDefault();let p=pos(e);ctx.lineWidth=4;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(...last);ctx.lineTo(...p);ctx.stroke();last=p}function en(){on=false}c.onmousedown=st;c.onmousemove=mv;c.onmouseup=en;c.onmouseleave=en;c.ontouchstart=st;c.ontouchmove=mv;c.ontouchend=en}
function saveSig(t,i){let k=t==='P'?'budgets':'invoices',x=S.get(k);x[i].signature=sig.toDataURL('image/png');S.set(k,x);viewDoc(t,i)}
function agenda(){let x=S.get('agenda');app.innerHTML=`<div class=card><h2>Agenda de trabajos</h2><div class=grid><label>Fecha<input id=ad type=date></label><label>Hora<input id=at type=time></label><label>Cliente / lugar<input id=ac></label><label>Repetición<select id=arep><option>No repetir</option><option>Semanal</option><option>Quincenal</option><option>Mensual</option></select></label><label>Tipo<select id=atype><option>Mantenimiento</option><option>Poda</option><option>Desbroce</option><option>Riego</option><option>Plantación</option><option>Visita / presupuesto</option><option>Otro</option></select></label><label class=full>Trabajo / notas<textarea id=an></textarea></label></div><div class=actions><button class="btn primary" onclick=addAgenda()>Guardar visita</button></div></div><div class=card>${x.length?x.slice().sort((a,b)=>(a.date+a.time).localeCompare(b.date+b.time)).map((e,i)=>`<div class=item><b>${e.date} ${e.time||''} · ${esc(e.client)}</b><div>${esc(e.type)} · ${esc(e.repeat||'No repetir')}</div><div class=small>${esc(e.notes)}</div><button class=btn onclick="delAgenda(${i})">Eliminar</button></div>`).join(''):'No hay trabajos programados.'}</div>`}
function addAgenda(){let x=S.get('agenda');x.push({date:ad.value,time:at.value,client:ac.value,type:atype.value,repeat:arep.value,notes:an.value});S.set('agenda',x);agenda()}function delAgenda(i){let x=S.get('agenda');x.splice(i,1);S.set('agenda',x);agenda()}
function expenses(){let x=S.get('expenses');app.innerHTML=`<div class=card><h2>Gastos y materiales</h2><div class=grid><label>Fecha<input id=ed type=date value="${new Date().toISOString().slice(0,10)}"></label><label>Categoría<select id=ec><option>Materiales</option><option>Combustible</option><option>Maquinaria</option><option>Herramientas</option><option>Vivero / plantas</option><option>Otros</option></select></label><label>Concepto<input id=en></label><label>Importe (€)<input id=ea type=number step=.01></label></div><div class=actions><button class="btn primary" onclick=addExpense()>Guardar gasto</button></div></div><div class=card><b>Total gastos: ${x.reduce((a,e)=>a+(+e.amount||0),0).toFixed(2)} €</b>${x.slice().reverse().map((e,ri)=>{let i=x.length-1-ri;return `<div class=item><b>${esc(e.name)}</b> · ${(+e.amount).toFixed(2)} €<div class=small>${e.date} · ${esc(e.category)}</div><button class=btn onclick="delExpense(${i})">Eliminar</button></div>`}).join('')}</div>`}
function addExpense(){let x=S.get('expenses');x.push({date:ed.value,category:ec.value,name:en.value,amount:+ea.value||0});S.set('expenses',x);expenses()}function delExpense(i){let x=S.get('expenses');x.splice(i,1);S.set('expenses',x);expenses()}
function summary(){let inv=S.get('invoices'),bud=S.get('budgets'),ex=S.get('expenses'),ag=S.get('agenda'),income=inv.reduce((a,d)=>a+(d.paid?d.total:0),0),pending=inv.reduce((a,d)=>a+(!d.paid?d.total:0),0),cost=ex.reduce((a,e)=>a+(+e.amount||0),0);app.innerHTML=`<div class=card><h2>Resumen</h2><div class=home><div class=card><b>Facturado</b><div class=total>${inv.reduce((a,d)=>a+d.total,0).toFixed(2)} €</div></div><div class=card><b>Cobrado</b><div class=total>${income.toFixed(2)} €</div></div><div class=card><b>Pendiente</b><div class=total>${pending.toFixed(2)} €</div></div><div class=card><b>Gastos</b><div class=total>${cost.toFixed(2)} €</div></div></div><p><b>Resultado simple (cobrado - gastos): ${(income-cost).toFixed(2)} €</b></p><div class=small>${bud.length} presupuestos · ${inv.length} facturas · ${S.get('clients').length} clientes · ${ag.length} trabajos en agenda</div></div>`}
function gardens(){let x=S.get('gardens');app.innerHTML=`<div class=card><h2>Fichas de jardines</h2><div class=grid><label>Cliente / jardín<input id=gn></label><label>Dirección<input id=ga></label><label>Césped<input id=gg placeholder="Tipo, estado, m²..."></label><label>Riego<input id=gr placeholder="Programador, sectores..."></label><label>Árboles / setos<input id=gt></label><label>Última poda<input id=gp type=date></label><label>Último tratamiento<input id=gtr type=date></label><label>Próxima visita<input id=gnext type=date></label><label class=full>Incidencias / notas<textarea id=gnotes></textarea></label><label class=full>Fotos antes/después<input id=gphotos type=file accept="image/*" multiple></label></div><div class=actions><button class="btn primary" onclick=addGarden()>Guardar ficha</button></div></div><div class=card>${x.length?x.map((g,i)=>`<div class=item><b>${esc(g.name)}</b><div class=small>${esc(g.address)}<br>Césped: ${esc(g.grass)} · Riego: ${esc(g.irrigation)}<br>Próxima visita: ${esc(g.next||'-')}<br>${esc(g.notes)}</div>${(g.photos||[]).map(p=>`<img src="${p}" style="width:90px;height:90px;object-fit:cover;border-radius:9px;margin:6px">`).join('')}<div class=actions><button class=btn onclick="window.open('https://maps.apple.com/?q='+encodeURIComponent('${'${esc(g.address)}'}'),'_blank')">📍 Ir</button><button class=btn onclick="del('gardens',${i})">Eliminar</button></div></div>`).join(''):'Todavía no hay fichas de jardines.'}</div>`}
function addGarden(){let files=[...gphotos.files].slice(0,4),photos=[];let finish=()=>{let x=S.get('gardens');x.push({name:gn.value,address:ga.value,grass:gg.value,irrigation:gr.value,trees:gt.value,lastPrune:gp.value,lastTreatment:gtr.value,next:gnext.value,notes:gnotes.value,photos});S.set('gardens',x);gardens()};if(!files.length)return finish();let left=files.length;files.forEach(f=>{let r=new FileReader;r.onload=()=>{photos.push(r.result);if(!--left)finish()};r.readAsDataURL(f)})}
function workReports(){let x=S.get('reports');app.innerHTML=`<div class=card><h2>Partes de trabajo</h2><div class=grid><label>Fecha<input id=rd type=date value="${new Date().toISOString().slice(0,10)}"></label><label>Cliente<input id=rc></label><label>Horas trabajadas<input id=rhours type=number step=.25></label><label>Estado<select id=rstatus><option>Finalizado</option><option>Pendiente</option></select></label><label class=full>Trabajo realizado<textarea id=rwork></textarea></label><label class=full>Materiales utilizados<textarea id=rmat></textarea></label><label class=full>Fotos<input id=rphotos type=file accept="image/*" multiple></label></div><div class=actions><button class="btn primary" onclick=addReport()>Guardar parte</button></div></div><div class=card>${x.length?x.slice().reverse().map((r,ri)=>{let i=x.length-1-ri;return `<div class=item><b>${r.date} · ${esc(r.client)}</b><div class=small>${(+r.hours||0)} h · ${esc(r.status)}<br>${esc(r.work)}<br>Materiales: ${esc(r.materials)}</div>${(r.photos||[]).map(p=>`<img src="${p}" style="width:90px;height:90px;object-fit:cover;border-radius:9px;margin:6px">`).join('')}<div class=actions><button class=btn onclick="signReport(${i})">✍️ Firma</button><button class=btn onclick="whatsReport(${i})">💬 WhatsApp</button><button class=btn onclick="del('reports',${i})">Eliminar</button></div></div>`}).join(''):'Todavía no hay partes.'}</div>`}
function addReport(){let files=[...rphotos.files].slice(0,4),photos=[];let finish=()=>{let x=S.get('reports');x.push({date:rd.value,client:rc.value,hours:+rhours.value||0,status:rstatus.value,work:rwork.value,materials:rmat.value,photos,signature:''});S.set('reports',x);workReports()};if(!files.length)return finish();let left=files.length;files.forEach(f=>{let fr=new FileReader;fr.onload=()=>{photos.push(fr.result);if(!--left)finish()};fr.readAsDataURL(f)})}
function signReport(i){app.innerHTML=`<div class=card><h2>Firma del parte</h2><canvas id=sig width=700 height=300 style="width:100%;height:220px;border:2px solid #ccd4cc;border-radius:12px;background:white;touch-action:none"></canvas><div class=actions><button class="btn primary" onclick="saveReportSig(${i})">Guardar firma</button><button class=btn onclick="workReports()">Cancelar</button></div></div>`;let c=sig,ctx=c.getContext('2d'),on=false,last;function pos(e){let r=c.getBoundingClientRect(),q=e.touches?e.touches[0]:e;return[(q.clientX-r.left)*c.width/r.width,(q.clientY-r.top)*c.height/r.height]}function st(e){e.preventDefault();on=true;last=pos(e)}function mv(e){if(!on)return;e.preventDefault();let p=pos(e);ctx.lineWidth=4;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(...last);ctx.lineTo(...p);ctx.stroke();last=p}function en(){on=false}c.onmousedown=st;c.onmousemove=mv;c.onmouseup=en;c.ontouchstart=st;c.ontouchmove=mv;c.ontouchend=en}
function saveReportSig(i){let x=S.get('reports');x[i].signature=sig.toDataURL('image/png');S.set('reports',x);workReports()}
function whatsReport(i){let r=S.get('reports')[i],txt=`SERÓN GROUNDS\nParte de trabajo ${r.date}\nCliente: ${r.client}\nTrabajo: ${r.work}\nHoras: ${r.hours}`;window.open('https://wa.me/?text='+encodeURIComponent(txt),'_blank')}
function backups(){app.innerHTML=`<div class=card><h2>Copias de seguridad</h2><p>Guarda periódicamente una copia. Incluye clientes, jardines, fotos, presupuestos, facturas, agenda, partes, gastos y servicios.</p><div class=actions><button class="btn primary" onclick=exportBackup()>Exportar copia</button><label class=btn>Importar copia<input type=file accept="application/json" onchange=importBackup(this) style="display:none"></label></div><p class=small>La copia se descarga como archivo JSON. Guárdala en “En mi iPhone”, Drive u otro lugar seguro.</p></div>`}
function exportBackup(){let data={version:3,exported:new Date().toISOString()};['clients','services','budgets','invoices','agenda','expenses','gardens','reports'].forEach(k=>data[k]=S.get(k));let b=new Blob([JSON.stringify(data,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='SERON_GROUNDS_copia_'+new Date().toISOString().slice(0,10)+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
function importBackup(inp){let f=inp.files[0];if(!f)return;let r=new FileReader;r.onload=()=>{try{let d=JSON.parse(r.result);if(!confirm('¿Restaurar esta copia? Se sustituirán los datos actuales.'))return;['clients','services','budgets','invoices','agenda','expenses','gardens','reports'].forEach(k=>{if(Array.isArray(d[k]))S.set(k,d[k])});alert('Copia restaurada correctamente.');go('Inicio')}catch(e){alert('La copia no es válida.')}};r.readAsText(f)}

if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});tabs();render();
</script></body></html>
