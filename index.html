{min-height:92px;border:1px solid #dbead7;border-radius:10px;background:#fff;padding:6px;cursor:pointer;overflow:hidden}.calday.other{opacity:.35}.calday.today{outline:3px solid var(--g)}.calnum{font-weight:800}.calevent{display:block;margin-top:4px;padding:4px 5px;border-radius:6px;font-size:10px;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.ev-work{background:#dff4d7}.ev-visit{background:#dcecff}.ev-budget{background:#fff1c9}.ev-maint{background:#e8dcf7}.callegend{display:flex;gap:10px;flex-wrap:wrap;font-size:12px;margin-top:10px}.caldot{padding:4px 7px;border-radius:7px}@media(max-width:650px){.calday{min-height:72px;padding:4px}.calevent{font-size:9px;padding:3px}.calhead{font-size:10px}.docrow,.hrow{grid-template-columns:1fr 1fr!important}.docrow label:first-child,.hrow label:first-child{grid-column:1/-1}.docrow button,.hrow button{grid-column:1/-1}.grid{grid-template-columns:1fr}.row{grid-template-columns:1fr 70px 90px auto}.home{grid-template-columns:1fr 1fr}header b{font-size:17px}}

</style></head><body><header><img src="logo.png"><div><b>SERÓN GROUNDS</b><div style="font-size:12px">Servicios Integrales de Jardinería</div></div></header><div class="wrap"><div class="tabs no-print" id="tabs"></div><main id="app"></main></div><script>
const COMPANY={name:'SERÓN GROUNDS SERVICIOS INTEGRALES DE JARDINERÍA',owner:'Miguel Ángel Serón Rodríguez',nif:'77236704J',phone:'644 039 107',email:'Info@serongrounds.es',address:'Avenida Alcalde Antonio Solano, 29120 Alhaurín el Grande, Málaga'};
const S={get(k,d=[]){return JSON.parse(localStorage.getItem(k)||JSON.stringify(d))},set(k,v){localStorage.setItem(k,JSON.stringify(v))}};
let page='Inicio'; const pages=['Inicio','Hoy','Clientes','Jardines','Trabajadores','Trabajos','Portal trabajador','Presupuestos','Facturas','Por horas','Agenda','Partes','Gastos','Servicios','Resumen','Configuración','Copias'];
const CFG=()=>S.get('settings',{iban:'',bic:'',bankOwner:'Miguel Ángel Serón Rodríguez',defaultVat:21,defaultIrpf:0,defaultHourly:30,paymentDays:30});
function tabs(){document.getElementById('tabs').innerHTML=pages.map(p=>`<button class="${p===page?'active':''}" onclick="go('${p}')">${p}</button>`).join('')}
function go(p){page=p;tabs();render()}; function esc(s=''){return String(s).replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function nextNo(type){let y=new Date().getFullYear(),cfg=CFG(),prefix=type==='P'?(cfg.budgetPrefix||'P'):(cfg.invoicePrefix||'F'),key=type==='P'?'budgets':'invoices',arr=S.get(key),nums=arr.filter(x=>x.no?.startsWith(prefix+'-'+y+'-')).map(x=>+x.no.split('-').pop());return `${prefix}-${y}-${String(Math.max(0,...nums)+1).padStart(3,'0')}`}
function render(){let a=document.getElementById('app'); if(page==='Inicio') a.innerHTML=`<div class=card><h2>Panel principal</h2><div class=home><button class="btn primary" onclick="newDoc('P')">＋ Nuevo presupuesto</button><button class="btn primary" onclick="newDoc('F')">＋ Nueva factura</button><button class=btn onclick="go('Hoy')">☀️ Hoy</button><button class=btn onclick="go('Clientes')">👤 Clientes</button><button class=btn onclick="go('Jardines')">🏡 Jardines</button><button class=btn onclick="go('Trabajadores')">👷 Trabajadores</button><button class=btn onclick="go('Trabajos')">🛠️ Trabajos</button><button class=btn onclick="go('Portal trabajador')">📲 Portal trabajador</button><button class=btn onclick="go('Servicios')">🌿 Servicios</button><button class=btn onclick="go('Agenda')">📅 Agenda</button><button class=btn onclick="go('Partes')">📝 Partes</button><button class=btn onclick="go('Por horas')">⏱️ Por horas</button><button class=btn onclick="go('Gastos')">💶 Gastos</button><button class=btn onclick="go('Resumen')">📊 Resumen</button><button class=btn onclick="go('Finanzas')">📈 Finanzas mes</button><button class=btn onclick="go('Configuración')">⚙️ Configuración</button><button class=btn onclick="go('Recurrentes')">🔁 Recurrentes</button><button class=btn onclick="go('Copias')">💾 Copias</button></div></div><div class=card><b>${COMPANY.owner}</b><div class=small>${COMPANY.nif} · ${COMPANY.phone}<br>${COMPANY.email}<br>${COMPANY.address}</div></div>${homeAlerts()}`; else if(page==='Hoy') todayPage(); else if(page==='Clientes') clients(); else if(page==='Jardines') gardens(); else if(page==='Trabajadores') workersAdmin(); else if(page==='Trabajos') sporadicJobsAdmin(); else if(page==='Portal trabajador') workerPortal(); else if(page==='Partes') workReports(); else if(page==='Por horas') hourlyJobs(); else if(page==='Configuración') settings(); else if(page==='Servicios') services(); else if(page==='Agenda') agenda(); else if(page==='Gastos') expenses(); else if(page==='Resumen') summary(); else if(page==='Finanzas') monthlyFinance(); else if(page==='Copias') backups(); else if(page==='Recurrentes') recurringJobs(); else listDocs(page==='Presupuestos'?'P':'F')}

function homeAlerts(){
 let today=new Date().toISOString().slice(0,10),limit=plusDays(today,7),allInv=S.get('invoices'),
 overdue=allInv.map((d,i)=>({d,i})).filter(o=>invoiceState(o.d)==='Vencida'),
 recurring=S.get('recurringJobs').filter(r=>r.next&&r.next>=today&&r.next<=limit).sort((a,b)=>a.next.localeCompare(b.next)),
 agenda=S.get('agenda').filter(e=>e.date>=today&&e.date<=limit).sort((a,b)=>(a.date+(a.time||'')).localeCompare(b.date+(b.time||''))).slice(0,8),
 overdueTotal=overdue.reduce((a,o)=>a+pendingAmount(o.d),0);
 return `<div class=card><h2>🔔 Avisos</h2>${overdue.length?`<p><b>${overdue.length} factura(s) vencida(s) · ${money(overdueTotal)} pendientes</b></p>${overdue.slice(0,5).map(o=>`<div class=item><b>${o.d.no} · ${esc(o.d.client?.name||'')}</b><div class=small>Venció ${o.d.due} · Pendiente ${money(pendingAmount(o.d))}</div><button class=btn onclick="shareWhatsApp('F',${o.i})">💬 Recordar</button></div>`).join('')}`:'<p class=small>No hay facturas vencidas.</p>'}</div>
 <div class=card><h2>📅 Próximos 7 días</h2>${agenda.length?agenda.map(e=>`<div class=item><b>${e.date} ${esc(e.time||'')} · ${esc(e.client||'')}</b><div class=small>${esc(e.type||'')} · ${esc(e.notes||'')}</div></div>`).join(''):'<p class=small>No hay citas próximas en agenda.</p>'}${recurring.length?`<h3>🔁 Mantenimientos recurrentes</h3>${recurring.map(r=>`<div class=item><b>${r.next} · ${esc(r.client?.name||'')}</b><div class=small>${esc(r.desc||'')} · ${esc(r.freq||'')}</div></div>`).join('')}`:''}</div>`
}

function clients(){let x=S.get('clients');app.innerHTML=`<div class=card><h2>Clientes</h2><div class=grid><label>Nombre<input id=cn></label><label>NIF/CIF<input id=ci></label><label>Teléfono<input id=cp></label><label>Email<input id=ce></label><label>Dirección fiscal<input id=ca></label><label>Dirección del trabajo<input id=cwork></label><label>C.P. / Población<input id=ccity></label><label class=full>Notas<textarea id=cnotes></textarea></label></div><div class=actions><button class="btn primary" onclick="addClient()">Guardar cliente</button></div></div><div class=card><input id=clientSearch placeholder="🔎 Buscar cliente..." oninput="filterClientCards()" style="margin-bottom:12px"><div id=clientCards>${x.length?x.map((c,i)=>`<div class=item><b>${esc(c.name)}</b><div class=small>${esc(c.nif)} · ${esc(c.phone)}<br>${esc(c.address)}</div><button class="btn no-print" onclick="clientHistory(${i})">📇 Historial</button><button class="btn no-print" onclick="whatsClient(${i})">💬 WhatsApp</button><button class="btn no-print" onclick="mapClient(${i})">📍 Ir</button><button class="btn no-print" onclick="del('clients',${i})">Eliminar</button></div>`).join(''):'Todavía no hay clientes.'}</div></div>`}
function sameClient(a,b){return !!(a&&b&&((a.nif&&b.nif&&a.nif===b.nif)||(a.name===b.name&&a.phone===b.phone)))}
function clientHistory(i){
 let c=S.get('clients')[i],bs=S.get('budgets').map((d,j)=>({d,j})).filter(o=>sameClient(o.d.client,c)),
 inv=S.get('invoices').map((d,j)=>({d,j})).filter(o=>sameClient(o.d.client,c)),
 hs=S.get('hourlyJobs').map((d,j)=>({d,j})).filter(o=>sameClient(o.d.client,c)),
 rs=S.get('recurringJobs').filter(r=>sameClient(r.client,c));
 app.innerHTML=`<div class=card><h2>📇 ${esc(c.name)}</h2><div class=small>${esc(c.nif||'')} · ${esc(c.phone||'')}<br>${esc(c.address||'')} ${esc(c.city||'')}</div></div>
 <div class=card><h3>Presupuestos</h3>${bs.length?bs.map(o=>`<div class=item><b>${o.d.no}</b> · ${o.d.date} · ${money(o.d.total)} <button class=btn onclick="viewDoc('P',${o.j})">Ver</button></div>`).join(''):'Ninguno'}</div>
 <div class=card><h3>Facturas</h3>${inv.length?inv.map(o=>`<div class=item><b>${o.d.no}</b> · ${o.d.date} · ${money(o.d.total)} · ${invoiceState(o.d)} <button class=btn onclick="viewDoc('F',${o.j})">Ver</button></div>`).join(''):'Ninguna'}</div>
 <div class=card><h3>Albaranes</h3>${hs.length?hs.map(o=>`<div class=item><b>${o.d.no}</b> · ${o.d.date||''} · ${money(o.d.total)} <button class=btn onclick="viewHourly(${o.j})">Ver</button></div>`).join(''):'Ninguno'}</div>
 <div class=card><h3>Trabajos recurrentes</h3>${rs.length?rs.map(r=>`<div class=item>${esc(r.desc)} · ${esc(r.freq)} · próxima ${r.next||'—'}</div>`).join(''):'Ninguno'}</div>
 <div class=actions><button class=btn onclick="go('Clientes')">Volver</button></div>`
}
function filterClientCards(){let q=(clientSearch.value||'').toLowerCase();document.querySelectorAll('#clientCards .item').forEach(e=>e.style.display=e.innerText.toLowerCase().includes(q)?'':'none')}
function mapClient(i){let c=S.get('clients')[i];if(!c.address){alert('Este cliente no tiene dirección.');return}window.open('https://maps.apple.com/?q='+encodeURIComponent(c.address),'_blank')}
function whatsClient(i){let c=S.get('clients')[i],n=String(c.phone||'').replace(/\D/g,'');if(!n){alert('Este cliente no tiene teléfono.');return}if(n.length===9)n='34'+n;let txt='Hola '+(c.name||'')+', soy Miguel de SERÓN GROUNDS.';window.open('https://wa.me/'+n+'?text='+encodeURIComponent(txt),'_blank')}
function addClient(){let x=S.get('clients');x.push({name:cn.value,nif:ci.value,phone:cp.value,email:ce.value,address:ca.value,workAddress:cwork.value,city:ccity.value,notes:cnotes.value});S.set('clients',x);clients()}function del(k,i){if(!confirm('¿Seguro que quieres eliminar este elemento? Esta acción no se puede deshacer.'))return;let x=S.get(k);x.splice(i,1);S.set(k,x);render()}
function services(){let x=S.get('services',[{name:'Mantenimiento de jardín',price:0},{name:'Poda',price:0},{name:'Desbroce',price:0},{name:'Limpieza de parcela',price:0},{name:'Instalación / reparación de riego',price:0},{name:'Plantación',price:0},{name:'Césped',price:0},{name:'Tratamientos',price:0},{name:'Mano de obra',price:0},{name:'Materiales',price:0}]);if(!localStorage.services)S.set('services',x);app.innerHTML=`<div class=card><h2>Servicios</h2><div class=grid><label>Concepto<input id=sn></label><label>Precio habitual (€)<input id=sp type=number step=.01></label></div><div class=actions><button class="btn primary" onclick="addService()">Añadir servicio</button></div></div><div class=card>${x.map((s,i)=>`<div class=item><b>${esc(s.name)}</b> <span class=small>${(+s.price).toFixed(2)} €</span><button class="btn no-print" onclick="del('services',${i})">Eliminar</button></div>`).join('')}</div>`}
function addService(){let x=S.get('services');x.push({name:sn.value,price:+sp.value||0});S.set('services',x);services()}
function listDocs(t){
 let k=t==='P'?'budgets':'invoices',x=S.get(k);
 app.innerHTML=`<div class=card><h2>${t==='P'?'Presupuestos':'Facturas'}</h2>
 <div class=actions><button class="btn primary no-print" onclick="newDoc('${t}')">＋ Nuevo</button>
 <input id=docSearch placeholder="🔎 Buscar por cliente, número o fecha..." oninput="filterDocs('${t}')" style="max-width:360px"></div></div>
 <div class=card id=docList></div>`;filterDocs(t)
}
function filterDocs(t){
 let k=t==='P'?'budgets':'invoices',x=S.get(k),q=(document.getElementById('docSearch')?.value||'').toLowerCase().trim(),box=document.getElementById('docList');
 let rows=x.map((d,i)=>({d,i})).filter(o=>!q||[o.d.no,o.d.client?.name,o.d.date,o.d.status].join(' ').toLowerCase().includes(q)).reverse();
 box.innerHTML=rows.length?rows.map(({d,i})=>`<div class=item><b>${d.no}</b> — ${esc(d.client?.name||'Sin cliente')}<div class=small>${d.date} · ${esc(d.status||'Pendiente')} · Total: ${(+d.total||0).toFixed(2)} €${t==='F'?' · '+invoiceState(d):''}</div><div class=actions no-print><button class=btn onclick="viewDoc('${t}',${i})">👁️ Vista previa</button><button class=btn onclick="editDoc('${t}',${i})">✏️ Editar</button><button class=btn onclick="duplicateDoc('${t}',${i})">📄 Duplicar</button><button class=btn onclick="shareWhatsApp('${t}',${i})">💬 WhatsApp</button>${t==='F'?`<button class="btn pdf-share" onclick="sharePDF('F',${i})">📄 PDF WhatsApp</button>`:''}${t==='P'?`<button class=btn onclick="acceptBudget(${i})">✅ Aceptado</button><button class=btn onclick="toInvoice(${i})">🧾 Convertir en factura</button>`:`<button class="btn primary" onclick="addPayment(${i})">💶 Cobro</button>`}<button class=btn onclick="del('${k}',${i})">Eliminar</button></div></div>`).join(''):'No hay resultados.'
}

function plusDays(d,n){let x=new Date(d+'T12:00:00');x.setDate(x.getDate()+n);return x.toISOString().slice(0,10)}
function newDoc(t){let clients=S.get('clients'),cfg=CFG(),today=new Date().toISOString().slice(0,10);app.innerHTML=`<div class=card><h2>Nuevo ${t==='P'?'presupuesto':'factura'} · ${nextNo(t)}</h2><div class=grid><label>Fecha de emisión<input id=date type=date value="${today}"></label>${t==='F'?`<label>Fecha límite de pago<input id=due type=date value="${plusDays(today,cfg.paymentDays||30)}"></label>`:''}<label>Cliente<select id=client><option value="">Seleccionar...</option>${clients.map((c,i)=>`<option value=${i}>${esc(c.name)}</option>`).join('')}</select></label><label>Estado<select id=status>${t==='P'?'<option>Pendiente</option><option>Aceptado</option><option>Rechazado</option>':'<option>Pendiente</option><option>Pagada</option>'}</select></label><label>Forma de pago<select id=payment><option>Transferencia</option><option>Efectivo</option><option>Tarjeta</option><option>Domiciliación</option><option>Otro</option></select></label><label class=full>Observaciones<textarea id=notes></textarea></label></div></div><div class=card><h2>Conceptos</h2><div class=small>Descripción · Cantidad · Precio · Descuento % · IVA % · IRPF % · Importe</div><div id=lines></div><button class="btn no-print" onclick="addLine()">＋ Añadir línea</button><div id=totals class=total style="margin-top:15px"></div><div class="actions no-print"><button class="btn primary" onclick="saveDoc('${t}')">Guardar</button><button class=btn onclick="go('${t==='P'?'Presupuestos':'Facturas'}')">Cancelar</button></div></div>`;addLine()}
function addLine(pref={}){let sv=S.get('services'),cfg=CFG(),d=document.createElement('div');d.className='docrow';d.style.cssText='display:grid;grid-template-columns:2fr .6fr .8fr .7fr .6fr .6fr .9fr auto;gap:6px;align-items:end;margin:10px 0';d.innerHTML=`<label>Descripción<select onchange="pickService(this)"><option value="">Escribir...</option>${sv.map((s,i)=>`<option value=${i}>${esc(s.name)}</option>`).join('')}</select><input class=desc value="${esc(pref.desc||'')}" placeholder="Descripción"></label><label>Cant.<input class=qty type=number value="${pref.qty??1}" step=.01 oninput=calc()></label><label>Precio €<input class=price type=number value="${pref.price??0}" step=.01 oninput=calc()></label><label>Dto. %<input class=ldisc type=number value="${pref.discount??0}" step=.01 oninput=calc()></label><label>IVA %<input class=lvat type=number value="${pref.vat??cfg.defaultVat??21}" step=.01 oninput=calc()></label><label>IRPF %<input class=lirpf type=number value="${pref.irpf??cfg.defaultIrpf??0}" step=.01 oninput=calc()></label><label>Importe<input class=lamount readonly></label><button class=btn onclick="this.parentElement.remove();calc()">×</button>`;lines.appendChild(d);calc()}

function calc(){let base=0,vatAmount=0,irpfAmount=0,discountAmount=0;document.querySelectorAll('.docrow').forEach(r=>{let q=+r.querySelector('.qty').value||0,p=+r.querySelector('.price').value||0,dp=+r.querySelector('.ldisc').value||0,vp=+r.querySelector('.lvat').value||0,ip=+r.querySelector('.lirpf').value||0,g=q*p,disc=g*dp/100,b=g-disc,v=b*vp/100,ir=b*ip/100,total=b+v-ir;base+=b;discountAmount+=disc;vatAmount+=v;irpfAmount+=ir;r.querySelector('.lamount').value=total.toFixed(2)+' €'});let total=base+vatAmount-irpfAmount;totals.innerHTML=`Base imponible: ${base.toFixed(2)} €<br>Descuentos: ${discountAmount.toFixed(2)} €<br>IVA: ${vatAmount.toFixed(2)} €<br>IRPF: -${irpfAmount.toFixed(2)} €<br><b>Total: ${total.toFixed(2)} €</b>`;return {base,discountAmount,vatAmount,irpfAmount,total}}

function viewDoc(t,i){let d=S.get(t==='P'?'budgets':'invoices')[i],cfg=CFG(),lines=d.lines||[];app.innerHTML=`<div class="card doc-view"><div style="display:flex;justify-content:space-between;gap:15px"><img src=logo.png style="width:220px;max-width:45%;object-fit:contain"><div style="text-align:right"><b style="font-size:20px">${t==='P'?'PRESUPUESTO':'FACTURA'}</b><div>Emisión: ${d.date}</div>${t==='F'&&d.due?`<div>Vencimiento: ${d.due}</div>`:''}<div class=small>Referencia: ${d.no}</div></div></div><hr class=doc-rule><div class=grid><div><b>${COMPANY.name}</b><div class=small>${COMPANY.owner}<br>NIF ${COMPANY.nif}<br>${COMPANY.address}<br>${COMPANY.phone} · ${COMPANY.email}</div></div><div class=doc-client><b>Cliente</b><div>${esc(d.client.name)}</div><div class=small>${esc(d.client.nif)}<br>${esc(d.client.address)} ${esc(d.client.city||'')}<br>${esc(d.client.phone)} · ${esc(d.client.email)}${d.client.workAddress?'<br>Trabajo: '+esc(d.client.workAddress):''}</div></div></div><div style="margin-top:20px;overflow:auto"><table class=doc-table style="width:100%;border-collapse:collapse"><tr><th align=left>Descripción</th><th>Cant.</th><th>Precio</th><th>Dto.</th><th>IVA</th><th>IRPF</th><th>Importe</th></tr>${lines.map(l=>{let b=(l.qty*l.price)*(1-(l.discount||0)/100),amt=b*(1+(l.vat??d.vat??21)/100-(l.irpf||0)/100);return `<tr><td>${esc(l.desc)}</td><td align=center>${l.qty}</td><td align=right>${(+l.price).toFixed(2)} €</td><td align=center>${l.discount||0}%</td><td align=center>${l.vat??d.vat??21}%</td><td align=center>${l.irpf||0}%</td><td align=right>${amt.toFixed(2)} €</td></tr>`}).join('')}</table></div><div class=total style="margin-top:15px">Base: ${(+d.base||0).toFixed(2)} €<br>IVA: ${(+d.vatAmount||0).toFixed(2)} €<br>IRPF: -${(+d.irpfAmount||0).toFixed(2)} €<br><b>Total: ${(+d.total||0).toFixed(2)} €</b></div><p><b>Forma de pago:</b> ${esc(d.payment||'Transferencia')}</p>${(d.payment||'Transferencia')==='Transferencia'&&cfg.iban?`<div class=doc-payment><b>I function duplicateDoc(t,i){

function acceptBudget(i){
 let b=S.get('budgets')[i];
 if(b.invoiceNo){alert('Este presupuesto ya generó la factura '+b.invoiceNo+'.');return}
 if(!confirm('¿Marcar este presupuesto como aceptado y crear automáticamente su factura?'))return;
 let cfg=CFG(),today=new Date().toISOString().slice(0,10),inv=S.get('invoices'),no=nextNo('F');
 let f={...JSON.parse(JSON.stringify(b)),no,date:today,due:plusDays(today,cfg.paymentDays||30),status:'Pendiente',paid:false,payments:[],signature:'',sourceBudget:b.no,notes:(b.notes?b.notes+'\n':'')+'Procedente del presupuesto '+b.no};
 inv.push(f);S.set('invoices',inv);
 let bs=S.get('budgets');bs[i].status='Aceptado';bs[i].acceptedDate=today;bs[i].invoiceNo=no;S.set('budgets',bs);

}

 x.push({...JSON.parse(JSON.stringify(b)),no,date:today,due:plusDays(today,cfg.paymentDays||30),status:'Pendiente',paid:false,payments:[],signature:'',sourceBudget:b.no,notes:(b.notes?b.notes+'\n':'')+'Procedente del presupuesto '+b.no});

function agenda(){let x=S.get('agenda'),first=new Date(agendaYear,agendaMonth,1),start=(first.getDay()+6)%7,days=new Date(agendaYear,agendaMonth+1,0).getDate(),prevDays=new Date(agendaYear,agendaMonth,0).getDate(),today=new Date().toISOString().slice(0,10),names=['L','M','X','J','V','S','D'],cells='';for(let c=0;c<42;c++){let day=c-start+1,yy=agendaYear,mm=agendaMonth,other=false;if(day<1){day=prevDays+day;mm--;other=true;if(mm<0){mm=11;yy--}}else if(day>days){day-=days;mm++;other=true;if(mm>11){mm=0;yy++}}let ds=`${yy}-${String(mm+1).padStart(2,'0')}-${String(day).padStart(2,'0')}`,ev=x.filter(e=>e.date===ds);cells+=`<div class="calday ${other?'other':''} ${ds===today?'today':''}" onclick="pickAgendaDay('${ds}')"><div class=calnum>${day}</div>${ev.slice(0,3).map(e=>`<span class="calevent ${agendaClass(e.type)}">${esc(e.time||'')} ${esc(e.client||e.type)}</span>`).join('')}${ev.length>3?`<span class=small>+${ev.length-3} más</span>`:''}</div>`}let month=new Intl.DateTimeFormat('es-ES',{month:'long',year:'numeric'}).format(first);app.innerHTML=`<div class=card><h2>📅 Agenda</h2><div class=calbar><button class=btn onclick="changeAgendaMonth(-1)">‹</button><b style="text-transform:capitalize">${month}</b><button class=btn onclick="changeAgendaMonth(1)">›</button></div><div class=calgrid>${names.map(n=>`<div class=calhead>${n}</div>`).join('')}${cells}</div><div class=callegend><span class="caldot ev-work">Trabajo</span><span class="caldot ev-visit">Cita / visita</span><span class="caldot ev-budget">Presupuesto</span><span class="caldot ev-maint">Mantenimiento</span></div><div class=actions><button class="btn primary" onclick="openAgendaForm()">＋ Nueva cita / trabajo</button><button class=btn onclick="agendaToday()">Hoy</button></div></div><div class=card><h3>Próximos</h3>${x.length?x.slice().sort((a,b)=>(a.date+(a.time||'')).localeCompare(b.date+(b.time||''))).filter(e=>e.date>=today).slice(0,12).map(e=>{let i=x.indexOf(e);return `<div class=item><b>${e.date} ${e.time|| function hourlyToInvoice(i){let h=S.get('hourlyJobs')[i],cfg=CFG(),today=new Date().toISOString().slice(0,10),lines=h.entries.map(e=>({desc:`${h.desc} - ${e.date} - ${e.workers} trabajador(es) × ${e.hours} h`,qty:e.workers*e.hours,price:e.rate,discount:0,vat:cfg.defaultVat||21,irpf:cfg.defaultIrpf||0}));if(h.materials)lines.push({desc:'Materiales',qty:1,price:h.materials,discount:0,vat:cfg.defaultVat||21,irpf:0});if(h.travel)lines.push({desc:'Desplazamiento',qty:1,price:h.travel,discount:0,vat:cfg.defaultVat||21,irpf:0});let base=lines.reduce((a,l)=>a+l.qty*l.price*(1-l.discount/100),0),vatAmount=lines.reduce((a,l)=>a+l.qty*l.price*(1-l.discount/100)*l.vat/100,0),irpfAmount=lines.reduce((a,l)=>a+l.qty*l.price*(1-l.discount/100)*l.irpf/100,0),x=S.get('invoices');x.push({no:nextNo('F'),date:today,due:plusDays(today,cfg.paymentDays||30),client:h.client,notes:`Procedente del albarán ${h.no}`,lines,base,vatAmount,irpfAmount,total:base+vatAmount-irpfAmount,status:'Pendiente',payment:'Transferencia',paid:false,signature:h.signature||''});S.set('invoices',x);page='Facturas';tabs();viewDoc('F',x.length-1)}

function exportBackup(){let data={version:6,exported:new Date().toISOString()};['clients','services','budgets','invoices','agenda','expenses','gardens','reports','hourlyJobs','recurringJobs','settings'].forEach(k=>data[k]=S.get(k));let b=new Blob([JSON.stringify(data,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='SERON_GROUNDS_copia_'+new Date().toISOString().slice(0,10)+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
function importBackup(inp){let f=inp.files[0];if(!f)return;let r=new FileReader;r.onload=()=>{try{let d=JSON.parse(r.result);if(!confirm('¿Restaurar esta copia? Se sustituirán los datos actuales.'))return;['clients','services','budgets','invoices','agenda','expenses','gardens','reports','hourlyJobs','recurringJobs'].forEach(k=>{if(Array.isArray(d[k]))S.set(k,d[k])});if(d.settings&&typeof d.settings==='object'&&!Array.isArray(d.settings))S.set('settings',d.settings);alert('Copia restaurada correctamente.');go('Inicio')}catch(e){alert('La copia no es válida.')}};r.readAsText(f)}


function money(n){return (+n||0).toFixed(2)+' €'}
function paymentsOf(d){return Array.isArray(d.payments)?d.payments:[]}
function paidAmount(d){if(d.paid&&!paymentsOf(d).length)return +d.total||0;return Math.min(+d.total||0,paymentsOf(d).reduce((a,p)=>a+(+p.amount||0),0))}
function pendingAmount(d){return Math.max(0,(+d.total||0)-paidAmount(d))}
function invoiceState(d){let paid=paidAmount(d),total=+d.total||0;if(total>0&&paid>=total-.005)return 'Pagada';if(paid>0)return 'Parcialmente pagada';if(d.due&&d.due<new Date().toISOString().slice(0,10))return 'Vencida';return 'Pendiente'}
function addPayment(i){let x=S.get('invoices'),d=x[i],pending=pendingAmount(d);if(pending<=0){alert('Esta factura ya está pagada.');return}let mode=prompt('Escribe % para porcentaje o € para importe. Ejemplo: 65% o 350€','65%');if(!mode)return;let amount=0,m=mode.replace(',','.').trim();if(m.includes('%'))amount=(+m.replace('%','')||0)/100*(+d.total||0);else amount=+m.replace('€','').trim()||0;if(amount<=0){alert('Importe no válido.');return}amount=Math.min(amount,pending);let method=prompt('Forma de pago: Transferencia, Efectivo, Tarjeta, Domiciliación u Otro',d.payment||'Transferencia')||d.payment||'Transferencia';d.payments=paymentsOf(d);d.payments.push({date:new Date().toISOString().slice(0,10),amount,method});d.paid=pendingAmount(d)<=.005;d.status=invoiceState(d);S.set('invoices',x);viewDoc('F',i)}
function paymentBlock(d,i){let paid=paidAmount(d),pending=pendingAmount(d),pct=d.total?paid/d.total*100:0;return `<div class="payment-block" style="margin-top:18px;background:var(--pale);border:1px solid #cfe9c7;border-radius:14px;padding:14px"><b>COBROS</b><div style="display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px;text-align:center"><div><small>Total</small><br><b>${money(d.total)}</b></div><div><small>Pagado</small><br><b>${money(paid)} (${pct.toFixed(1)}%)</b></div><div><small>Pendiente</small><br><b>${money(pending)}</b></div></div>${paymentsOf(d).map(p=>`<div class=small style="margin-top:7px">${p.date} · ${esc(p.method)} · ${money(p.amount)}</div>`).join('')}<div class="actions no-print"><button class="btn primary" onclick="addPayment(${i})">＋ Registrar cobro</button></div></div>`}

  <div class=card><h2>Conceptos</h2><div class=small>Descripción · Cantidad · Precio · Descuento % · IVA % · IRPF % · Importe</div>

  <div id=totals class=total style="margin-top:15px"></div>
  <div class="actions no-print"><button class="btn primary" onclick="updateDoc('${t}',${i})">Guardar cambios</button>
  <button class=btn onclick="viewDoc('${t}',${i})">Cancelar</button></div></div>`;
  (d.lines||[]).forEach(l=>addLine(l));
  if(!(d.lines||[]).length)addLine();

}

function updateDoc(t,i){
  let ci=client.value;
  if(ci===''){alert('Selecciona un cliente.');return}
  let newNo=(docno.value||'').trim().toUpperCase();
  if(!newNo){alert('La referencia no puede quedar vacía.');docno.focus();return}
  let k=t==='P'?'budgets':'invoices',x=S.get(k);
  if(x.some((d,j)=>j!==i&&String(d.no||'').trim().toUpperCase()===newNo)){
    alert('Ya existe otro '+(t==='P'?'presupuesto':'factura')+' con la referencia '+newNo+'. Elige otra referencia.');
    docno.focus();return
  }
  let c=S.get('clients')[+ci];
  let linesA=[...document.querySelectorAll('.docrow')].map(r=>({
    desc:r.querySelector('.desc').value,
    qty:+r.querySelector('.qty').value||0,
    price:+r.querySelector('.price').value||0,
    discount:+r.querySelector('.ldisc').value||0,
    vat:+r.querySelector('.lvat').value||0,
    irpf:+r.querySelector('.lirpf').value||0
  })).filter(x=>x.desc);
  if(!linesA.length){alert('Añade al menos un concepto.');return}
  let sums=calc(),old=x[i];
  x[i]={
    ...old,
    no:newNo,
    date:date.value,
    due:t==='F'?due.value:'',
    client:c,
    notes:notes.value,
    lines:linesA,
    status:status.value,
    payment:payment.value,
    paid:t==='F' ? (status.value==='Pagada' ? true : (paymentsOf(old).length ? paidAmount(old)>=sums.total-.005 : false)) : old.paid,
    ...sums
  };
  if(t==='F' && status.value==='Pagada' && !paymentsOf(x[i]).length){
    x[i].payments=[{date:new Date().toISOString().slice(0,10),amount:sums.total,method:payment.value}];
  }
  S.set(k,x);
  viewDoc(t,i);
}

async function cloudRequest(key,method='GET',data=null){
  const url=SUPABASE_URL+'/rest/v1/seron_data?key=eq.'+encodeURIComponent(key);
  const opt={method,headers:{'apikey':SUPABASE_KEY,'Content-Type':'application/json','Prefer':'return=representation'}};
  if(data!==null)opt.body=JSON.stringify(data);
  const r=await fetch(url,opt); if(!r.ok)throw new Error(await r.text()); return r.status===204?[]:await r.json();
}
async function cloudLoad(key){try{let rows=await cloudRequest(key);if(rows&&rows[0]&&Array.isArray(rows[0].data)){S.set(key,rows[0].data);return rows[0].data}}catch(e){console.warn('Nube no disponible',key,e)}return S.get(key)}
async function cloudSave(key,value){S.set(key,value);try{let rows=await cloudRequest(key);if(rows&&rows.length)await cloudRequest(key,'PATCH',{data:value,updated_at:new Date().toISOString()});else await fetch(SUPABASE_URL+'/rest/v1/seron_data',{method:'POST',headers:{'apikey':SUPABASE_KEY,'Content-Type':'application/json','Prefer':'return=minimal'},body:JSON.stringify({key,data:value})});return true}catch(e){console.warn('Guardado local; nube pendiente',e);return false}}

async function workerPortal(){await cloudRefresh();let ws=S.get('workers').filter(w=>w.active),jobs=workerJobs();app.innerHTML=`<div class=card><h2>📲 Portal del trabajador</h2>${cloudBadge()}<p class=small>Fichaje, trabajo realizado, pendientes, incidencias y fotos.</p><div class=grid><label>Trabajador<select id=pworker><option value="">Seleccionar...</option>${ws.map(w=>`<option value="${w.id}">${esc(w.name)}</option>`).join('')}</select></label><label>Buscar jardín / trabajo<input id=psearch placeholder="Escribe el nombre..." oninput=filterWorkerJobs()></label><label class=full>Jardín o trabajo<select id=pjob><option value="">Seleccionar...</option>${jobs.map(j=>`<option value="${j.id}" data-search="${esc((j.name+' '+j.address+' '+j.kind).toLowerCase())}">${esc(j.name)} · ${esc(j.kind)}${j.address?' · '+esc(j.address):''}</option>`).join('')}</select></label></div><div class=actions><button class="btn primary" onclick=clockIn()>🟢 Fichar entrada</button><button class=btn onclick=clockOut()>🔴 Fichar salida</button><button class=btn onclick=showJobTeam()>👥 Equipo en este jardín</button></div><div id=jobTeamBox></div></div><div class=card><h3>Trabajo / incidencia</h3><div class=grid><label>Resultado<select id=presult><option>Trabajo terminado</option><option>Queda trabajo pendiente</option><option>Incidencia</option><option>Falta material</option></select></label><label class=full>Trabajo realizado / qué falta<textarea id=pnotes placeholder="Explica qué se ha hecho o qué queda pendiente..."></textarea></label><label class=full>Fotos<input id=pphotos type=file accept="image/*" multiple></label></div><div class=actions><button class="btn primary" onclick=saveWorkerIncident()>📸 Guardar y enviar</button></div></div><div class=card><h3>Mis últimos registros</h3><div id=workerRecent class=small>Selecciona tu nombre para verlos.</div></div>`;pworker.onchange=showWorkerRecent}
