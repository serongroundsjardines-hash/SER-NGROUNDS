<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#173f2a"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="SERÓN Trabajador">
<link rel="manifest" href="./manifest-trabajador.json"><link rel="apple-touch-icon" href="./logo.png"><title>SERÓN GROUNDS · Portal trabajador</title>
<style>
:root{--g:#49b92f;--g2:#238a2f;--dark:#173f2a;--pale:#eef9e9;--bg:#f7fbf5;--mut:#5d6d5f;--red:#b42318}*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:#172018}header{background:linear-gradient(135deg,var(--dark),var(--g2));color:#fff;padding:14px 16px;display:flex;align-items:center;gap:14px;position:sticky;top:0;z-index:3}header img{width:100px;height:68px;object-fit:contain;background:#fff;border-radius:8px}.wrap{max-width:760px;margin:auto;padding:16px}.card{background:#fff;border:1px solid #e3f1df;border-radius:16px;padding:16px;margin-bottom:14px;box-shadow:0 2px 10px #0000000b}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}label{font-size:13px;font-weight:700;color:var(--mut)}input,select,textarea{width:100%;padding:13px;border:1px solid #cfe3ca;border-radius:10px;margin-top:5px;font:inherit;background:#fff}textarea{min-height:90px}.full{grid-column:1/-1}.actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:14px}.btn{border:0;border-radius:11px;padding:13px 15px;font-weight:800;font-size:15px}.primary{background:var(--g);color:#fff}.danger{background:#fee4e2;color:var(--red)}.secondary{background:#e8eee7}.small{font-size:13px;color:var(--mut)}.item{padding:11px 0;border-bottom:1px solid #edf0ed}.ok{background:var(--pale);padding:10px;border-radius:10px;margin:10px 0}#error{display:none;background:#fff1f0;color:#8a1c13;border:1px solid #f7c5c0;border-radius:10px;padding:10px;margin:10px 0;white-space:pre-wrap}.photo{width:85px;height:85px;object-fit:cover;border-radius:9px;margin:5px}@media(max-width:650px){.grid{grid-template-columns:1fr}.full{grid-column:1}.actions .btn{flex:1 1 45%}}</style></head>
<body><header><img src="./logo.png"><div><b>SERÓN GROUNDS</b><div style="font-size:12px">Portal del trabajador</div></div></header><div class="wrap">
<div class="card"><h2>📲 Fichaje</h2><div class="ok">☁️ Conectado con SERÓN GROUNDS</div><div id="error"></div><div class="grid">
<label>Trabajador<select id="worker"><option value="">Cargando…</option></select></label><label>Buscar jardín / trabajo<input id="search" placeholder="Escribe el nombre..."></label>
<label class="full">Jardín o trabajo<select id="job"><option value="">Cargando…</option></select></label></div>
<div class="actions"><button class="btn primary" id="clockIn">🟢 Fichar entrada</button><button class="btn danger" id="clockOut">🔴 Fichar salida</button><button class="btn secondary" id="reload">↻ Actualizar</button></div></div>
<div class="card"><h2>📝 Parte / incidencia</h2><p class="small">Registra lo realizado, lo pendiente, materiales usados o cualquier incidencia. No se muestran precios.</p><div class="grid">
<label>Estado<select id="result"><option>Trabajo realizado</option><option>Pendiente</option><option>Hay que volver</option><option>Incidencia</option></select></label>
<label>Tipo de foto<select id="photoType"><option>Antes</option><option>Durante</option><option>Después</option><option>Incidencia</option></select></label>
<label class="full">Observaciones<textarea id="notes" placeholder="Qué se ha hecho, qué falta, problema encontrado..."></textarea></label>
<label class="full">Materiales utilizados<textarea id="materials" placeholder="Ej.: 2 sacos de sustrato, 4 goteros..."></textarea></label>
<label class="full">Fotos<input id="photos" type="file" accept="image/*" capture="environment" multiple></label></div>
<div class="actions"><button class="btn primary" id="savePart">📤 Enviar parte</button></div></div>
<div class="card"><h3>Mis últimos fichajes y partes</h3><div id="recent" class="small">Selecciona tu nombre.</div></div></div>
<script>
const URL='https://vkateeqhqmjbjzicjmnz.supabase.co',KEY='sb_publishable_qAVU4eC6uUeVsHkKPYm0Jw_cbC9TmXO';
const H={apikey:KEY,Authorization:'Bearer '+KEY,Accept:'application/json','Content-Type':'application/json'};let workers=[],jobs=[];const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));function err(m=''){$('error').style.display=m?'block':'none';$('error').textContent=m}
async function api(table,method='GET',query='',data=null){const res=await fetch(URL+'/rest/v1/'+table+(query?'?'+query:''),{method,headers:{...H,Prefer:'return=representation'},body:data===null?undefined:JSON.stringify(data),cache:'no-store'});const text=await res.text();let body=[];try{body=text?JSON.parse(text):[]}catch{body=text}if(!res.ok)throw new Error((body&&body.message)||text||('HTTP '+res.status));return body}
async function load(){err('');try{[workers,jobs]=await Promise.all([api('workers','GET','select=*&order=id.asc'),api('jobs','GET','select=*&order=id.asc')]);workers=workers.filter(x=>x.active!==false);jobs=jobs.filter(x=>x.active!==false);$('worker').innerHTML='<option value="">Seleccionar...</option>'+workers.map(x=>`<option value="${x.id}">${esc(x.name||('Trabajador '+x.id))}</option>`).join('');drawJobs();$('recent').textContent='Selecciona tu nombre.'}catch(e){err('No se pudieron cargar los datos: '+e.message)}}
function drawJobs(){const q=$('search').value.trim().toLowerCase(),list=jobs.filter(x=>!q||String((x.name||'')+' '+(x.address||'')+' '+(x.type||x.kind||'')).toLowerCase().includes(q));$('job').innerHTML='<option value="">Seleccionar...</option>'+list.map(x=>`<option value="${x.id}">${esc(x.name||('Trabajo '+x.id))}${x.type?' · '+esc(x.type):''}${x.address?' · '+esc(x.address):''}</option>`).join('')}
async function inClick(){err('');const wid=Number($('worker').value),jid=Number($('job').value);if(!wid||!jid)return alert('Selecciona trabajador y jardín/trabajo.');try{const open=await api('clockings','GET',`worker_id=eq.${wid}&exit_time=is.null&select=*&order=created_at.desc`);if(open.length)return alert('Ya tienes un fichaje abierto. Primero ficha la salida.');await api('clockings','POST','',{worker_id:wid,job_id:jid,entry_time:new Date().toISOString(),exit_time:null});alert('Entrada registrada correctamente.');await showRecent()}catch(e){err('No se pudo fichar la entrada: '+e.message)}}
async function outClick(){err('');const wid=Number($('worker').value);if(!wid)return alert('Selecciona el trabajador.');try{const open=await api('clockings','GET',`worker_id=eq.${wid}&exit_time=is.null&select=*&order=created_at.desc&limit=1`);if(!open.length)return alert('No tienes ningún fichaje abierto.');await api('clockings','PATCH',`id=eq.${encodeURIComponent(open[0].id)}`,{exit_time:new Date().toISOString()});alert('Salida registrada correctamente.');await showRecent()}catch(e){err('No se pudo fichar la salida: '+e.message)}}
function compressPhoto(file){return new Promise((resolve,reject)=>{const rd=new FileReader();rd.onerror=reject;rd.onload=()=>{const im=new Image();im.onerror=reject;im.onload=()=>{let w=im.width,h=im.height,max=1200;if(w>max||h>max){const s=Math.min(max/w,max/h);w=Math.round(w*s);h=Math.round(h*s)}const c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d').drawImage(im,0,0,w,h);resolve(c.toDataURL('image/jpeg',.72))};im.src=rd.result};rd.readAsDataURL(file)})}
async function savePart(){err('');const wid=$('worker').value,jid=$('job').value;if(!wid||!jid)return alert('Selecciona trabajador y jardín/trabajo.');if(!$('notes').value.trim()&&!$('materials').value.trim()&&!$('photos').files.length)return alert('Escribe el parte, materiales o añade una foto.');try{const files=[...$('photos').files].slice(0,4),pics=[];for(const f of files)pics.push({category:$('photoType').value,data:await compressPhoto(f)});const j=jobs.find(x=>String(x.id)===String(jid));let note=$('notes').value.trim();if($('materials').value.trim())note+=(note?'\n\n':'')+'MATERIALES UTILIZADOS:\n'+$('materials').value.trim();await api('worker_incidents','POST','',{worker_id:String(wid),job_id:String(jid),job_name:j?.name||('Trabajo '+jid),job_kind:j?.type||j?.kind||'Trabajo',result:$('result').value,notes:note,photos:pics,status:'Nueva'});$('notes').value='';$('materials').value='';$('photos').value='';alert('Parte enviado correctamente.');await showRecent()}catch(e){err('No se pudo enviar el parte: '+e.message)}}
function fmt(v){if(!v)return '—';try{return new Date(v).toLocaleString('es-ES',{dateStyle:'short',timeStyle:'short'})}catch{return v}}
function picsHtml(p){return Array.isArray(p)?p.map(x=>{let src=typeof x==='string'?x:x?.data;return src?`<img class="photo" src="${src}">`:''}).join(''):''}
async function showRecent(){const wid=Number($('worker').value);if(!wid){$('recent').textContent='Selecciona tu nombre.';return}try{const [rows,parts]=await Promise.all([api('clockings','GET',`worker_id=eq.${wid}&select=*&order=created_at.desc&limit=10`),api('worker_incidents','GET',`worker_id=eq.${wid}&select=*&order=created_at.desc&limit=10`).catch(()=>[])]);$('recent').innerHTML=(rows.map(r=>{const j=jobs.find(x=>Number(x.id)===Number(r.job_id));return `<div class="item"><b>⏱️ ${esc(j?.name||('Trabajo '+r.job_id))}</b><div class="small">Entrada: ${esc(fmt(r.entry_time))}<br>Salida: ${r.exit_time?esc(fmt(r.exit_time)):'🟢 En curso'}</div></div>`}).join('')+parts.map(r=>`<div class="item"><b>📝 ${esc(r.job_name||'Trabajo')} · ${esc(r.result||'Parte')}</b><div class="small">${esc(fmt(r.created_at))}<br>${esc(r.notes||'').replace(/\n/g,'<br>')}</div>${picsHtml(r.photos)}</div>`).join(''))||'Todavía no hay registros.'}catch(e){err('No se pudieron cargar los registros: '+e.message)}}
$('search').addEventListener('input',drawJobs);$('worker').addEventListener('change',showRecent);$('clockIn').addEventListener('click',inClick);$('clockOut').addEventListener('click',outClick);$('reload').addEventListener('click',load);$('savePart').addEventListener('click',savePart);load();
</script></body></html>
